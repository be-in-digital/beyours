name: Publish mirror

# Pushes `apps/themes` to be-in-digital/beyours-boilerplate, the repository
# client sites are cloned from, rewriting everything that only makes sense
# inside the monorepo (workspace: dependencies, lockfile, vercel.json, package
# name). Transformation details: scripts/publish-mirror.mjs
#
# Two triggers, because the mirror can drift in two ways:
#   - the template changes      → push to main touching apps/themes/**
#   - the packages are released → the Release workflow finishes
#
# Required secret: MIRROR_PUSH_TOKEN, a fine-grained PAT with `contents: write`
# on beyours-boilerplate. Without it the job stops cleanly — GITHUB_TOKEN is
# scoped to the current repository and cannot push elsewhere.
#
# The pnpm version comes from `apps/themes/package.json` rather than being
# pinned here. The script runs `pnpm install` inside the mirror clone, whose
# `packageManager` field is a copy of that same file — so installing a
# different version made pnpm try to switch itself mid-run, fail, and hang.
# See the note on the pnpm step below.

on:
  push:
    branches: [main]
    paths:
      - "apps/themes/**"
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      check_only:
        description: "Dry run: report drift without pushing"
        type: boolean
        default: false

concurrency:
  group: publish-mirror
  # The script rebuilds the mirror in full from the current commit, so a newer
  # run always produces the wanted result and an older one is redundant. Two
  # triggers fire on a merge that both touches apps/themes and releases, and
  # without this they queued behind each other and cancelled each other by
  # turns. It also means a stuck run cannot hold the group: the next trigger
  # ends it.
  cancel-in-progress: true

jobs:
  publish:
    name: Sync the mirror
    runs-on: ubuntu-latest
    # A sync takes about two minutes. Without a ceiling the pnpm hang described
    # below held a runner for fifty minutes, and would have held it for six
    # hours — the whole time blocking every later sync.
    timeout-minutes: 15
    # On workflow_run, do nothing if the Release failed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check the push secret
        id: gate
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          if [ -z "${MIRROR_PUSH_TOKEN}" ]; then
            echo "::notice::MIRROR_PUSH_TOKEN is missing — running as a dry run. See the README to create it."
            echo "can_push=false" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      # Deliberately apps/themes and not the repository root.
      #
      # The lockfile this job writes is the *mirror's*, generated inside the
      # mirror clone — and that clone's `packageManager` is a copy of
      # apps/themes'. pnpm honours that field by switching itself to the version
      # it names, so installing the root's pnpm here (10.4.1, against the
      # mirror's 10.28.1) meant pnpm tried to switch mid-run, failed, and hung.
      #
      # Reading the same file the mirror inherits from is what keeps the two
      # from drifting apart again: bump apps/themes and this follows.
      #
      # Note there is no `version:` input alongside this. The action refuses
      # both at once — "Multiple versions of pnpm specified" — because the
      # root package.json also names one.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/themes/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@be-in-digital"

      - name: Sync
        env:
          # Registry read: the packages are published by this repository, so
          # GITHUB_TOKEN is enough with `packages: read`.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          if [ "${{ steps.gate.outputs.can_push }}" = "true" ] \
             && [ "${{ inputs.check_only }}" != "true" ]; then
            node scripts/publish-mirror.mjs
          else
            node scripts/publish-mirror.mjs --check
          fi
