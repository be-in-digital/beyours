name: Publish mirror

# Pushes `apps/themes` to be-in-digital/beyours-boilerplate, the repository
# client sites are cloned from, rewriting everything that only makes sense
# inside the monorepo (workspace: dependencies, lockfile, vercel.json, package
# name). Transformation details: scripts/publish-mirror.mjs
#
# Two triggers, because the mirror can drift in two ways:
#   - the template changes      → push to main touching apps/themes/**
#   - the packages are released → the Release workflow finishes
#
# Both of them push to a repository every client site merges from, so both are
# gated on CI. The `push` and `workflow_dispatch` paths were not: the job
# carried no `needs:`, and its only `if:` guarded the `workflow_run` path, so a
# push touching apps/themes/** rsynced to the boilerplate IN PARALLEL with the
# checks that would have said it was broken. `release.yml` had the same shape
# and was fixed the same way — see the `verify` job below.
#
# Since #308 the gate is the whole of what branch protection requires, E2E
# included. Measured on merge `aa026e6`: the mirror had shipped 35 seconds
# after the merge and the suite reported 11m02s later, so a regression the
# suite catches was already on the distribution mirror before it was caught
# (#307). The sync now waits for it.
#
# Which sharpened what each trigger is FOR. The `push` path owns every change to
# what a client receives — that is what its `paths:` filter enumerates — and it
# is the gated one. The `workflow_run` path owns exactly one thing, the pinned
# versions moving, and now refuses to do anything else: a Release that published
# nothing leaves it alone rather than letting it re-ship the same template
# ungated, minutes before the gated run finishes. See "Did that Release publish
# anything?" below.
#
# Required secret: MIRROR_PUSH_TOKEN, a fine-grained PAT with `contents: write`
# on beyours-boilerplate. Without it the job stops cleanly — GITHUB_TOKEN is
# scoped to the current repository and cannot push elsewhere.

on:
  push:
    branches: [main]
    paths:
      - "apps/themes/**"
      # The publisher's own inputs. The mirror is not only what `apps/themes`
      # holds — it is that tree AFTER these scripts transform it, plus the root
      # `packageManager` they copy into it verbatim. A change to any of them
      # changes what a client receives while `apps/themes` is untouched, and
      # used to trigger no sync at all. The `packageManager` field is not a
      # hypothetical: a version mismatch in it is what hung the job and left the
      # mirror twelve days stale. `engine-exports.mjs` and
      # `mirror-typecheck.mjs` are the gates that decide whether a sync may run
      # at all, which is the same kind of input: a fix to one must get the
      # chance to run.
      - "scripts/publish-mirror.mjs"
      - "scripts/lib/mirror-tree.mjs"
      - "scripts/lib/engine-exports.mjs"
      - "scripts/lib/mirror-typecheck.mjs"
      # The registry lookup that decides which VERSION each engine dependency is
      # pinned to, and the overrides carried across with it. Both change what a
      # client installs from an untouched `apps/themes`.
      - "scripts/lib/registry.mjs"
      - "scripts/lib/mirror-overrides.mjs"
      - "package.json"
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      check_only:
        description: "Dry run: report drift without pushing"
        type: boolean
        default: false

concurrency: publish-mirror

jobs:
  # The gate, copied from `release.yml`: a reusable-workflow call that runs
  # `Lint`, `Type Check`, `Test` and `Build` — the four contexts branch
  # protection requires — on THIS commit, in-line, as nested jobs. Not a
  # `workflow_run` listener: the mirror must never publish from a SHA it had to
  # reconstruct from an event payload.
  #
  # `Lint` is the one that matters most here. It is where `pnpm check:mirror-css`
  # runs, and that is the only REQUIRED check that materialises the published
  # tree and compiles it — i.e. the only one branch protection makes look at
  # what a client would actually receive. It used to run alongside the push
  # rather than before it.
  #
  # It compiles the stylesheet, against symlinked `packages/<name>`. The
  # TypeScript half needs the registry, so it lives in the sync itself, after
  # the pinning: see "compiling the tree against the versions it pins" in
  # `publish-mirror.mjs`.
  #
  # `E2E Status` is the fifth, and it is `e2e` below — a second call, because
  # `e2e.yml` gained `workflow_call:` in the same change (#307, #308).
  verify:
    name: Verify
    # Skipped on the `workflow_run` path, and only there. The Release chain has
    # already run this exact call on the commit it published, and the `if:` on
    # `publish` below refuses a Release that did not go green. Re-running it
    # here would also check the WRONG tree: a `workflow_run` job checks out the
    # default branch's current head, not the SHA the Release ran on.
    if: github.event_name != 'workflow_run'
    permissions:
      contents: read
      # `packages: read`, because a CALLED workflow may not request more than
      # its caller grants — and `ci.yml`'s `lint` job began requesting it in
      # #446, to read the published tarballs for the subpath half of
      # `check:source-drift`.
      #
      # This one line is what its absence cost: every `Release` and every
      # `Publish mirror` since e5394e5 ended in `startup_failure`. The run never
      # begins, so it has no jobs, no steps and no logs — nothing that reads as
      # a failure anyone would open. Three merges published nothing (#446, #447,
      # #448) and the mirror stayed frozen throughout, while `ci.yml`'s own
      # `push` and `pull_request` runs stayed green: a reusable workflow is only
      # narrowed when it is CALLED, so the fault is invisible from the file that
      # causes it.
      packages: read
    uses: ./.github/workflows/ci.yml

  # `E2E Status`, the fifth required check, on the tree about to be shipped.
  #
  # `themes` only, and that is the point rather than a saving: this workflow
  # ships `apps/themes` and nothing else, so the bench's suite would be four
  # more runners answering a question the mirror never asked. It is half the
  # cost of `both` for the whole of the answer.
  #
  # What it proves is bounded, and worth stating plainly: the suite runs
  # `apps/themes` against `packages/*` at HEAD through the workspace link, while
  # the mirror pins the versions the REGISTRY serves. So this catches a
  # regression in the template's own code and cannot catch one that only appears
  # once the published tarballs are installed — that is `check:pending-release`,
  # the subpath gate in `publish-mirror.mjs` and, since #408, its compile gate,
  # which installs the pinned versions and typechecks against them.
  #
  # Skipped on the `workflow_run` path for the same reason `verify` is: the
  # Release chain has already run this call on the commit it published, and
  # re-running it here would check the wrong tree. Skipped on a `--check`
  # dispatch too — that path reports drift and pushes nothing, so it has nothing
  # to gate, and a twelve-minute suite to answer "is the mirror stale?" is a
  # tool nobody would reach for twice.
  #
  # The latency is real and was the open question in #307: a template change
  # used to reach the boilerplate 35 seconds after the merge and now waits for
  # the suite, about twelve minutes. That is the cost of the sync not being the
  # first thing to know a change is broken.
  e2e:
    name: Verify E2E
    if: github.event_name != 'workflow_run' && inputs.check_only != true
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      apps: themes

  # The delivered tree, installed and RUN the way a client receives it.
  #
  # WHY THIS IS HERE AND NOT IN `ci.yml`. `check:mirror-build` builds the whole
  # engine, packs nine tarballs, installs them into a materialised copy of
  # `apps/themes` and then typechecks and tests it — minutes, on every run that
  # pays for it. Its own header says so and concludes "deliberately NOT wired
  # into CI: run it before cutting a release, and after publishing one." That
  # reasoning is about which runs should pay, not about whether anything should:
  # this workflow IS the delivery, so it is the run that should.
  #
  # WHAT IT CATCHES THAT THE GATES ABOVE CANNOT. `verify` and `e2e` run
  # `apps/themes` inside the workspace — `packages/*` symlinked at HEAD,
  # `apps/` above it, the monorepo all around it. A client has none of that.
  # Every check in this repository was green at `a7862e90` while
  # `beyours-boilerplate` had been red since 7 September, because four shipped
  # test files reached ABOVE the application root for `packages/`, `apps/docs/`
  # and the sibling app. Nothing that runs inside the workspace can see a path
  # that only resolves inside the workspace.
  #
  # The check reproduces it exactly — `Test Files 3 failed | 140 passed (143)`,
  # the boilerplate's own line — so this is a gate with a measured catch, not a
  # precaution. `CLAUDE.md` rule 9 tells every client to run `pnpm test` before
  # they commit; until now nothing in this repository ever did.
  #
  # It runs on the `workflow_run` path too, unlike `verify` and `e2e`. Those are
  # skipped there because the Release chain already ran that exact call on that
  # exact commit. It did not run this one — `release.yml` has no such step — so
  # skipping here would leave the path that carries newly published versions
  # with no check of the delivered tree at all. Hence the same `ref:` the
  # `publish` job uses: a `workflow_run` job checks out the default branch's
  # current head, and the tree that matters is the SHA the Release ran on.
  #
  # Skipped on a `--check` dispatch, for the reason `e2e` is: that path pushes
  # nothing, so it has nothing to gate.
  delivered:
    name: Verify the delivered tree
    if: inputs.check_only != true
    runs-on: ubuntu-latest
    # Measured warm at about four minutes; the ceiling is a stall detector, and
    # the install of a ~1.1 GB template on a cold store is the slow half.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      # The commit the Release verified on the `workflow_run` path; empty
      # elsewhere, which leaves the default. Same reasoning as `publish` below.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@be-in-digital"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The engine packages are packed from THIS tree, so the check measures the
      # code about to be delivered rather than whatever the registry serves
      # today. Nothing is fetched from GitHub Packages — the materialised tree's
      # `.npmrc` is emptied and every engine dependency is pinned to a local
      # tarball — but the token is passed for the same reason the sync passes
      # it: a dependency that later resolves from the registry must not turn
      # this into a 401 nobody expected.
      - name: Build, install and run the tree a client receives
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:mirror-build

  publish:
    name: Sync the mirror
    needs: [verify, e2e, delivered]
    runs-on: ubuntu-latest
    # A sync is a clone, a file copy, a lockfile and — since the compile gate —
    # an install and a typecheck of the staged tree. Measured warm: 4s and 46s.
    # The runner is not warm on a first run and the tree is ~1.1 GB of
    # node_modules, which is what the `cache: pnpm` below is for; budget a few
    # minutes when it misses.
    #
    # The ceiling exists because the failure that mattered here did not fail:
    # pnpm hit a version it could not switch to, hung, and the job sat until
    # somebody cancelled it fifty minutes later. `cancelled` is neither a pass
    # nor a failure, so the mirror went twelve days without a sync and no run
    # ever said so. A stall must now end as a red job.
    #
    # 15 until the compile gate joined it. Raised only to 20, not doubled: the
    # ceiling is a stall detector, and one a healthy run cannot approach is the
    # only kind that detects anything.
    timeout-minutes: 20
    # One condition per trigger path, and every path is gated:
    #   workflow_run   → the Release it followed went green, and the commit
    #                    synced is the one Release verified — see the checkout
    #                    below. A step there narrows it further to a Release
    #                    that PUBLISHED, which is the only kind that ran the
    #                    E2E suite and the only kind this path exists for
    #   push, dispatch → `verify` AND `e2e` above went green on this commit, AND
    #                    the commit is on `main`
    #
    # `delivered` gates BOTH, because unlike `verify` and `e2e` it runs on both:
    # the Release chain never ran it, so the `workflow_run` path would otherwise
    # carry newly published versions to every client with nothing having
    # installed the delivered tree.
    #
    # `e2e` is read by what it did NOT do, because `skipped` is a legitimate
    # answer here — a `--check` dispatch skips it deliberately — while `failure`
    # and `cancelled` are not. A suite the concurrency group cancelled has not
    # passed.
    #
    # The ref check is not redundant with `verify`. `uses: ./…/ci.yml` resolves
    # at the CALLER's ref, so a manual dispatch from a branch runs THAT branch's
    # ci.yml over THAT branch's tree — a branch that guts ci.yml supplies its
    # own gate, and with zero required reviews nothing forces the branch through
    # review first. Even without malice, dispatching from a stale branch to
    # "re-sync the mirror" would ship that branch to every client site.
    #
    # `!cancelled()` is load-bearing rather than decorative. `verify` and `e2e`
    # are deliberately skipped on the `workflow_run` path, and a job whose
    # `needs:` was skipped is skipped too unless its `if:` uses a status
    # function. Without it this whole workflow would silently stop syncing after
    # a Release — a gate that never publishes looks exactly like a gate that
    # works.
    if: >-
      ${{ !cancelled()
        && needs.delivered.result != 'failure'
        && needs.delivered.result != 'cancelled'
        && (
          (github.event_name == 'workflow_run'
            && github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.head_branch == 'main')
          || (github.event_name != 'workflow_run'
            && needs.verify.result == 'success'
            && needs.e2e.result != 'failure'
            && needs.e2e.result != 'cancelled'
            && github.ref == 'refs/heads/main')
        ) }}
    permissions:
      contents: read
      packages: read
    outputs:
      # What the sync actually did — `pushed`, `current`, `drift` or, when the
      # step never ran at all, empty. `report` below turns it into the run's
      # conclusion. See `record()` in scripts/publish-mirror.mjs.
      outcome: ${{ steps.sync.outputs.mirror_outcome }}
      ran: ${{ steps.sync.outcome }}
      can_push: ${{ steps.gate.outputs.can_push }}
    steps:
      - name: Check the push secret
        id: gate
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          if [ -z "${MIRROR_PUSH_TOKEN}" ]; then
            echo "::notice::MIRROR_PUSH_TOKEN is missing — running as a dry run. See the README to create it."
            echo "can_push=false" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          fi

      # The commit Release verified, not whatever `main` points at now.
      #
      # A `workflow_run` job defaults to the default branch's CURRENT head, so
      # the sequence was: Release goes green on A; B lands on `main` while
      # Release is still installing, building and publishing; the mirror then
      # receives B. The `if:` above proved something about A and shipped B.
      # `verify` is skipped on this path precisely because Release already ran
      # it — which is only true of A, so A is what has to be checked out.
      #
      # Empty on every other trigger, which leaves the default behaviour.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Tags, because the step below reads them. A depth-1 clone fetches
          # none by default.
          fetch-tags: true

      # The hole the E2E gate would otherwise leave open, and it is not
      # hypothetical — it is the exact case #307 is about.
      #
      # A merge touching `apps/themes/**` starts BOTH paths. The `push` one
      # waits for `e2e` (~13 min) and refuses a red suite. The Release it also
      # started publishes nothing (a template change moves no package version),
      # goes green in ~5 minutes on `verify` alone, and this `workflow_run` path
      # then syncs the same tree with no E2E behind it at all. The gate above
      # would be doing its job while the sync went out beside it.
      #
      # So this path is held to what it exists for: a Release that ACTUALLY
      # published. `changeset publish` tags each package it publishes and
      # release.yml pushes those tags — the same invariant that workflow's own
      # last step asserts ("if a version was published, its tag must exist
      # here"). Tags at this commit therefore mean the Release published, and a
      # Release that published ran the E2E suite, because `plan` said it would.
      #
      # Nothing is lost by stopping otherwise. Every input that changes what a
      # client receives is in this workflow's `paths:` filter, so a template
      # change always has a `push` run of its own — a gated one. What stops here
      # is the second, ungated delivery of a tree that run is already handling.
      # A `push` run that was cancelled or died can be re-sent with
      # `workflow_dispatch`.
      - name: Did that Release publish anything?
        id: released
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail

          # FETCH THE TAGS FIRST. `fetch-tags: true` on the checkout above does
          # not survive a `ref:` that is a SHA: the fetch actions/checkout then
          # runs carries no tag refspec at all. Measured on run 34407658142,
          # the whole of it was
          #
          #   git … fetch --prune --no-recurse-submodules --depth=1 origin de6de57…
          #
          # so `git tag --points-at HEAD` read an EMPTY tag namespace, this step
          # answered "that Release published nothing", the sync was skipped, and
          # the job went green. That Release had published eight packages,
          # `@be-in-digital/convex-functions@7.0.0` among them — the exact
          # version the mirror's export gate had been failing on for a day.
          #
          # The condition is unreachable rather than merely wrong: with no tags
          # ever fetched, this path could never answer "published", so it could
          # never sync. Every `workflow_run` sync since the check was added was
          # a no-op reported as a success.
          if ! git fetch --depth=1 origin "+refs/tags/*:refs/tags/*" 2>/dev/null; then
            # A fetch that FAILED is not a Release that published nothing, and
            # answering "false" here is what froze the mirror silently. An
            # unanswerable question stops the run instead.
            echo "::error::Could not fetch tags, so whether that Release published cannot be determined. Refusing to guess — a wrong 'no' here skips the sync and reports success."
            exit 1
          fi

          tags=$(git tag --points-at HEAD)
          if [ -z "$tags" ]; then
            echo "::notice::That Release published nothing — no tags at $(git rev-parse --short HEAD). The push path owns any template change, and it waits for the E2E suite. Skipping."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "Released:"; echo "$tags" | sed "s/^/  /"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      # `cache: pnpm` for the store, keyed on this repository's lockfile. The
      # sync installs the MIRROR's lockfile, not this one, so the key is only
      # ever approximately right — but the store is content-addressed and the
      # two dependency sets are nearly identical, so a hit still spares the
      # compile gate a cold download of the whole template. Without it that
      # install is a full download on every single sync, which is what puts a
      # healthy run anywhere near the stall ceiling above.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@be-in-digital"
          cache: "pnpm"

      - name: Sync
        id: sync
        # On `workflow_run`, only for a Release that published — see above.
        # Every other trigger reaches here having passed `verify` and `e2e`.
        if: github.event_name != 'workflow_run' || steps.released.outputs.published == 'true'
        env:
          # Registry read: the packages are published by this repository, so
          # GITHUB_TOKEN is enough with `packages: read`.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          if [ "${{ steps.gate.outputs.can_push }}" = "true" ] \
             && [ "${{ inputs.check_only }}" != "true" ]; then
            node scripts/publish-mirror.mjs
          else
            node scripts/publish-mirror.mjs --check
          fi

  # WHAT A GREEN RUN MEANS.
  #
  # Every exit from `publish-mirror.mjs` is 0 or 1, and three different things
  # exit 0: a push happened, the mirror was already identical, and a `--check`
  # that pushed nothing by design. On top of that, the `Sync` step is skipped
  # entirely when a Release published nothing, and the whole `publish` job is
  # skipped when its `if:` does not hold — a manual dispatch from a branch, for
  # one. GitHub reports a skipped job as a green run.
  #
  # So "Publish mirror ✓" covered both "the client repository now has your
  # change" and "nothing happened", with nothing in the history to tell them
  # apart. That is the state the mirror was in for twelve days.
  #
  # This job gives every run a stated outcome and makes the ones that were
  # SUPPOSED to push and did not go red. It does not invent failures: a
  # deliberate `--check` dispatch, and the deliberate stand-down after a
  # Release that published nothing, both pass — with a summary line saying so,
  # which is the part that was missing.
  report:
    name: What this run did
    needs: [verify, e2e, delivered, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Grade the run
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          SYNC_RAN: ${{ needs.publish.outputs.ran }}
          OUTCOME: ${{ needs.publish.outputs.outcome }}
          CAN_PUSH: ${{ needs.publish.outputs.can_push }}
          CHECK_ONLY: ${{ inputs.check_only }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          say() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          say "## Publish mirror"
          say ""

          # A deliberate dry run. It reports drift and pushes nothing, and
          # saying so is the whole of its job.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$CHECK_ONLY" = "true" ]; then
            say "**Dry run** — drift reported, nothing pushed. This is what \`check_only\` asks for."
            echo "::notice title=Dry run::No push was attempted."
            exit 0
          fi

          case "$OUTCOME" in
            pushed)
              say "**Pushed.** The boilerplate now carries this commit's \`apps/themes\`."
              echo "::notice title=Mirror synced::The boilerplate was updated."
              exit 0
              ;;
            current)
              say "**Nothing to push.** The mirror was already byte-identical to \`apps/themes\`."
              echo "::notice title=Mirror already current::No files differed."
              exit 0
              ;;
          esac

          # Past here, no sync happened and none was explicitly requested to be
          # skipped. Say which of the ways it was, then fail — a run that was
          # meant to deliver and did not must not read as a delivery.
          if [ "$EVENT" = "workflow_run" ] && [ "$SYNC_RAN" = "skipped" ]; then
            # The one designed stand-down: a Release that published nothing.
            # The push path owns any template change and is gated; this path
            # exists only for the pinned versions moving.
            say "**Stood down.** That Release published nothing, so there were no pinned versions to carry."
            say ""
            say "Any template change is owned by the \`push\` run for the same commit, which waits for the E2E suite."
            echo "::notice title=Nothing to carry::The Release published no packages."
            exit 0
          fi

          if [ "$PUBLISH_RESULT" = "skipped" ]; then
            say "**No sync ran.** The \`publish\` job's conditions were not met — it is limited to \`main\`, and requires \`Verify\`, \`Verify E2E\` and \`Verify the delivered tree\` to have passed."
          elif [ "$CAN_PUSH" != "true" ]; then
            say "**No sync ran.** \`MIRROR_PUSH_TOKEN\` is not set, so the job could only dry-run. Client sites are not receiving this commit."
            say ""
            say "Create the token (a fine-grained PAT with \`contents: write\` on \`beyours-boilerplate\`) and re-run."
          else
            say "**No sync ran**, and the reason is not one this job knows how to name. Read the \`Sync\` step: outcome \`${OUTCOME:-none}\`, step \`${SYNC_RAN:-none}\`, job \`${PUBLISH_RESULT}\`."
          fi
          say ""
          say "This run is red because a green one means the client repository was updated."
          echo "::error title=Mirror not synced::No push happened on a run that was expected to publish. See the summary."
          exit 1
