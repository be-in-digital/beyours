name: Env store health

# Asks the Infisical store, once a day, whether it can still answer.
#
# Nothing else does. `ci.yml`'s build job reads /platform behind
# `continue-on-error`, so an outage there degrades a build silently; the
# annotation it now prints is only seen by whoever opens that run. And
# `setup-convex-env.sh` is run by hand, in a client repo, at rotation time —
# which is the worst possible moment to discover that the machine identity
# expired three weeks ago.
#
# NOT a required check, and it must never become one. It reads a store that
# lives outside this repository: making a merge depend on a third party's
# uptime is exactly the trade `ci.yml` refuses. It reports, that is all.
#
# AND "REPORTS" USED TO MEAN AN ANNOTATION NOBODY OPENS. This workflow runs at
# 06:15 on a schedule, so there is no pull request to annotate and no author to
# notify: a red run sat in the Actions tab and was seen by whoever thought to
# look, which since it was created is nobody (#442). A daily check that fails
# silently is not a check — it is a second thing to be wrong about.
#
# It now opens an issue, and comments on that issue rather than duplicating it,
# exactly as `mirror-health.yml` does for the same reason. `continue-on-error`
# for the same reason too: this organisation forbids Actions from opening pull
# requests and whether that extends to issues is not something this repository
# can read, so a refusal must not be the thing that hides the finding.
#
# THE SKIP IS ALSO REPORTED NOW. `INFISICAL_ENABLED` unset, or the machine
# identity missing, produced a green run that checked nothing — the same
# green as a healthy store. The distinction now reaches the job summary, so
# "the store is fine" and "nobody has wired the store up" stop looking alike.
on:
  schedule:
    # 06:15 UTC — after the nightly security scan, before the working day, and
    # off the hour because everyone else's cron is on it.
    - cron: "15 6 * * *"
  # So a rotation can be verified on the spot rather than waited out.
  workflow_dispatch:
    inputs:
      environment:
        description: "Infisical environment slug to check"
        required: false
        default: prod

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check the store answers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The report below. Same grant, and the same narrow use, as
      # `mirror-health.yml`: one issue, commented on rather than duplicated.
      issues: write
    env:
      # Same two gates as ci.yml, for the same reason: a step's `if:` cannot
      # read `secrets`, a job's `env:` can. Without them this workflow would go
      # red every morning on a repository that has not wired the store up yet,
      # which trains everyone to ignore it before it has ever said anything.
      HAS_INFISICAL: ${{ secrets.INFISICAL_CLIENT_ID != '' && secrets.INFISICAL_CLIENT_SECRET != '' }}
      INFISICAL_ENV_SLUG: ${{ github.event.inputs.environment || vars.INFISICAL_ENV || 'prod' }}
    steps:
      - name: Skip when the store is not wired up yet
        if: vars.INFISICAL_ENABLED != 'true' || env.HAS_INFISICAL != 'true'
        run: |
          echo "::notice title=Skipped::INFISICAL_ENABLED or the machine identity is not set; nothing to check."
          {
            echo "## Env store health — **not checked**"
            echo
            echo "Nothing was asked of the store, so this green run says nothing about it."
            echo
            echo "Missing:"
            if [ "${{ vars.INFISICAL_ENABLED }}" != "true" ]; then
              echo "- the repository variable \`INFISICAL_ENABLED\` is not \`true\`"
            fi
            if [ "${HAS_INFISICAL}" != "true" ]; then
              echo "- the secrets \`INFISICAL_CLIENT_ID\` and \`INFISICAL_CLIENT_SECRET\` (the CI machine identity)"
            fi
            echo
            echo "Until both are set, a rotated credential cannot be verified to reach any"
            echo "client deployment — \`tasks/secret-rotation-runbook.md\` A.1 depends on this check."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        if: vars.INFISICAL_ENABLED == 'true' && env.HAS_INFISICAL == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: vars.INFISICAL_ENABLED == 'true' && env.HAS_INFISICAL == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The CLI, not the secrets-action: this job asks a question about the
      # store rather than consuming its values, and `check` needs to talk to
      # several folders.
      #
      # It comes from Infisical's own apt repository, which is their documented
      # path and is NOT pinned the way `ci.yml` pins the secrets-action to a
      # commit SHA. The difference is deliberate: that action is handed the
      # machine identity, this step runs before any credential exists in the
      # job, and this job is read-only and blocks nothing. Pin it to a released
      # binary the day it does more than ask a question.
      - name: Install the Infisical CLI
        if: vars.INFISICAL_ENABLED == 'true' && env.HAS_INFISICAL == 'true'
        # `shell: bash` is `-eo pipefail`; GitHub's default `run:` shell is
        # `bash -e {0}`, WITHOUT pipefail. So `curl … | sudo -E bash` reported
        # sudo's status: a 404 or a network blip fed an empty script to bash,
        # bash exited 0, and the step went green with no CLI installed. It only
        # became visible once this job gained a step behind `if: failure()` —
        # before that, nothing in the job read another step's outcome and
        # `mirror-staleness-watch.test.ts` had nothing to check.
        shell: bash
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical
          infisical --version

      - name: Log in as the CI machine identity
        if: vars.INFISICAL_ENABLED == 'true' && env.HAS_INFISICAL == 'true'
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          TOKEN=$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" --silent --plain)
          # ::add-mask:: first, so the token cannot appear in any later log line
          # even if a command decides to echo its environment.
          echo "::add-mask::$TOKEN"
          echo "INFISICAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # `check` distinguishes its two failures in its exit code, which is the
      # whole reason this workflow can say something useful:
      #
      #   0  every folder complete
      #   1  the store answered, and its contents do not match the specs
      #   3  the store, or the session, is down
      #
      # 1 is a backlog item — the folders have been partly empty since the store
      # was created, and a red build every morning for a known state is how a
      # signal gets muted. 3 is an incident: it means the chain that propagates
      # a rotated credential is broken right now, and nobody would find out
      # until the next rotation.
      #
      # No `pnpm install` anywhere above: the script imports node builtins only,
      # so this job is a checkout, a node and a CLI. `report.txt` holds key
      # names, not values — `check` throws every value away unread.
      - name: Ask the store, and grade the answer
        id: ask
        if: vars.INFISICAL_ENABLED == 'true' && env.HAS_INFISICAL == 'true'
        # Named for the same reason, though this one already read the left-hand
        # status by hand with `PIPESTATUS[0]` — which is more precise than
        # pipefail, since the whole point here is to distinguish exit 1 from
        # exit 3. `set +e` around the pipeline keeps that intact under `-e`.
        shell: bash
        run: |
          set +e
          node scripts/infisical-bootstrap.mjs check --env="$INFISICAL_ENV_SLUG" | tee report.txt
          code=${PIPESTATUS[0]}
          set -e

          {
            echo "## Infisical \`$INFISICAL_ENV_SLUG\` — exit $code"
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$code" in
            0)
              echo "::notice title=Store healthy::Every folder in $INFISICAL_ENV_SLUG matches its spec."
              ;;
            1)
              echo "::warning title=Store incomplete::$INFISICAL_ENV_SLUG is missing keys, or a shared folder holds a per-deployment secret. Not an outage — see the job summary for the names. \`pnpm env:plan\` prints how to fill them."
              ;;
            3)
              echo "::error title=Store unreachable::The Infisical store or the CI machine identity did not answer for $INFISICAL_ENV_SLUG. Until this is fixed, a rotated credential cannot reach any client deployment — tasks/secret-rotation-runbook.md A.1 depends on it."
              exit 1
              ;;
            *)
              echo "::error title=Check failed::infisical-bootstrap.mjs exited $code, which it is not supposed to. See the job summary."
              exit 1
              ;;
          esac

      # WHY THIS STEP EXISTS. Everything above writes annotations and a job
      # summary, and this workflow runs at 06:15 on a schedule — no pull
      # request to annotate, no author to notify. So a failure was visible only
      # to somebody who opened the Actions tab, which is how it came to fail
      # every run without anyone finding out (#442).
      #
      # `mirror-health.yml` solved the identical problem for the mirror and
      # this is the same shape, deliberately: one issue, commented on rather
      # than duplicated, `continue-on-error` so a refused issue does not become
      # the reason the finding is lost.
      #
      # It fires on any failure of the job, not only on the `check` script's
      # exit 3 — the login step can fail too, and an expired machine identity
      # is precisely the thing this workflow exists to catch early.
      - name: Say that the store is not answering
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Env store health: the Infisical store is not answering"
        run: |
          set -uo pipefail
          {
            echo "The daily env-store check failed for \`${INFISICAL_ENV_SLUG}\`."
            echo
            if [ -f report.txt ]; then
              echo "The store answered, and the answer was graded a failure:"
              echo
              echo '```'
              tail -40 report.txt
              echo '```'
            else
              echo "**The check never got as far as asking.** The CI machine identity"
              echo "(\`INFISICAL_CLIENT_ID\` / \`INFISICAL_CLIENT_SECRET\`) did not log in,"
              echo "or the CLI could not be installed. An expired or rotated machine"
              echo "identity is the likeliest cause, and it is exactly what this workflow"
              echo "exists to find before a rotation does."
            fi
            echo
            echo "**Why it matters:** until the store answers, a rotated credential cannot"
            echo "be propagated to any client deployment — \`tasks/secret-rotation-runbook.md\`"
            echo "A.1 depends on this chain. Nothing is broken in production because of it;"
            echo "the recovery path is."
            echo
            echo "**To check by hand:** \`pnpm env:check\` with the machine identity in the"
            echo "environment, or re-run this workflow from the Actions tab once the"
            echo "identity is renewed."
            echo
            echo "[This report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > /tmp/env-store-health.md

          cat /tmp/env-store-health.md >> "$GITHUB_STEP_SUMMARY"

          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/env-store-health.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/env-store-health.md
          fi
