name: Env store health

# Asks the Infisical store, once a day, whether it can still answer.
#
# Nothing else does. `ci.yml`'s build job reads /platform behind
# `continue-on-error`, so an outage there degrades a build silently; the
# annotation it now prints is only seen by whoever opens that run. And
# `setup-convex-env.sh` is run by hand, in a client repo, at rotation time —
# which is the worst possible moment to discover that the machine identity
# expired three weeks ago.
#
# NOT a required check, and it must never become one. It reads a store that
# lives outside this repository: making a merge depend on a third party's
# uptime is exactly the trade `ci.yml` refuses. It reports, that is all.
on:
  schedule:
    # 06:15 UTC — after the nightly security scan, before the working day, and
    # off the hour because everyone else's cron is on it.
    - cron: "15 6 * * *"
  # So a rotation can be verified on the spot rather than waited out.
  workflow_dispatch:
    inputs:
      environment:
        description: "Infisical environment slug to check"
        required: false
        default: prod

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check the store answers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # So this workflow can say something where somebody reads it. Without
      # this it could only go red in a tab nobody opens, which is the state it
      # was in for every run it ever made.
      issues: write
    env:
      # Same two gates as ci.yml, for the same reason: a step's `if:` cannot
      # read `secrets`, a job's `env:` can. Without them this workflow would go
      # red every morning on a repository that has not wired the store up yet,
      # which trains everyone to ignore it before it has ever said anything.
      HAS_INFISICAL: ${{ secrets.INFISICAL_CLIENT_ID != '' && secrets.INFISICAL_CLIENT_SECRET != '' }}
      INFISICAL_ENV_SLUG: ${{ github.event.inputs.environment || vars.INFISICAL_ENV || 'prod' }}
    steps:
      - name: Skip when the store is not wired up yet
        if: vars.INFISICAL_ENABLED != 'true' || env.HAS_INFISICAL != 'true'
        run: |
          echo "::notice title=Skipped::INFISICAL_ENABLED or the machine identity is not set; nothing to check."
          echo "Store not configured — nothing checked." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        if: vars.INFISICAL_ENABLED == 'true' && env.HAS_INFISICAL == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: vars.INFISICAL_ENABLED == 'true' && env.HAS_INFISICAL == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The CLI, not the secrets-action: this job asks a question about the
      # store rather than consuming its values, and `check` needs to talk to
      # several folders.
      #
      # It comes from Infisical's own apt repository, which is their documented
      # path and is NOT pinned the way `ci.yml` pins the secrets-action to a
      # commit SHA. The difference is deliberate: that action is handed the
      # machine identity, this step runs before any credential exists in the
      # job, and this job is read-only and blocks nothing. Pin it to a released
      # binary the day it does more than ask a question.
      - name: Install the Infisical CLI
        if: vars.INFISICAL_ENABLED == 'true' && env.HAS_INFISICAL == 'true'
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical
          infisical --version

      # `id` and `continue-on-error`, because THIS is the step that has been
      # failing. Two scheduled runs, two failures, both here:
      #
      #   error: unable to authenticate with universal auth
      #   [err=APIError: CallUniversalAuthLogin unsuccessful response
      #   [POST https://app.infisical.com/api/v1/auth/universal-auth/login]
      #   [status-code=401] [message="Invalid credentials"]]
      #
      # A step that aborts the job takes every later step with it, including any
      # reporting — so the workflow built to say the secrets store is
      # unreachable was, itself, unable to say anything. It failed silently from
      # the day it landed. The grading step below is gated on this outcome and
      # the reporter at the end runs either way.
      - name: Log in as the CI machine identity
        id: login
        continue-on-error: true
        if: vars.INFISICAL_ENABLED == 'true' && env.HAS_INFISICAL == 'true'
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          TOKEN=$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" --silent --plain)
          # ::add-mask:: first, so the token cannot appear in any later log line
          # even if a command decides to echo its environment.
          echo "::add-mask::$TOKEN"
          echo "INFISICAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # `check` distinguishes its two failures in its exit code, which is the
      # whole reason this workflow can say something useful:
      #
      #   0  every folder complete
      #   1  the store answered, and its contents do not match the specs
      #   3  the store, or the session, is down
      #
      # 1 is a backlog item — the folders have been partly empty since the store
      # was created, and a red build every morning for a known state is how a
      # signal gets muted. 3 is an incident: it means the chain that propagates
      # a rotated credential is broken right now, and nobody would find out
      # until the next rotation.
      #
      # No `pnpm install` anywhere above: the script imports node builtins only,
      # so this job is a checkout, a node and a CLI. `report.txt` holds key
      # names, not values — `check` throws every value away unread.
      - name: Ask the store, and grade the answer
        id: grade
        continue-on-error: true
        # `shell: bash` is load-bearing now that this step has an `id` another
        # condition reads. GitHub's default `run:` shell on Linux is `bash -e`
        # WITHOUT `-o pipefail`, so `node … | tee report.txt` would report
        # *tee's* status as the step's. The `case` below happens to decide the
        # exit code from `PIPESTATUS[0]`, which is correct — but a guard cannot
        # see that, and neither can the next person to edit this block.
        # `mirror-staleness-watch.test.ts` holds the rule, having been written
        # after exactly this mistake made `mirror-health.yml` a no-op.
        shell: bash
        if: >-
          vars.INFISICAL_ENABLED == 'true' && env.HAS_INFISICAL == 'true'
            && steps.login.outcome == 'success'
        run: |
          set +e
          node scripts/infisical-bootstrap.mjs check --env="$INFISICAL_ENV_SLUG" | tee report.txt
          code=${PIPESTATUS[0]}
          set -e

          {
            echo "## Infisical \`$INFISICAL_ENV_SLUG\` — exit $code"
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$code" in
            0)
              echo "::notice title=Store healthy::Every folder in $INFISICAL_ENV_SLUG matches its spec."
              ;;
            1)
              echo "::warning title=Store incomplete::$INFISICAL_ENV_SLUG is missing keys, or a shared folder holds a per-deployment secret. Not an outage — see the job summary for the names. \`pnpm env:plan\` prints how to fill them."
              ;;
            3)
              echo "::error title=Store unreachable::The Infisical store or the CI machine identity did not answer for $INFISICAL_ENV_SLUG. Until this is fixed, a rotated credential cannot reach any client deployment — tasks/secret-rotation-runbook.md A.1 depends on it."
              exit 1
              ;;
            *)
              echo "::error title=Check failed::infisical-bootstrap.mjs exited $code, which it is not supposed to. See the job summary."
              exit 1
              ;;
          esac

      # ── Say it where somebody reads it ──────────────────────────────────────
      #
      # WHY THIS EXISTS. This workflow has failed EVERY run it has ever made —
      # 2026-09-08 and 2026-09-09, both `schedule`, both at the login step with
      # a 401 — and told nobody. It carried no `if: failure()` step, no
      # `gh issue create`, nothing. A daily check that goes red into an empty
      # room is not a check; the secrets store the whole fleet model depends on
      # could not be authenticated by CI, and the thing built to say so was
      # itself silent.
      #
      # `mirror-health.yml` already does exactly this — it is how #426 and #439
      # exist — so the pattern was in the repository and this workflow simply
      # did not use it. Same shape, same `continue-on-error` for the same
      # reason: if the organisation forbids Actions from opening issues, the
      # step summary is still written and the job is still red, and the fallback
      # must never be the thing that hides the finding.
      #
      # `if: always()` rather than `failure()`: the grading step is
      # `continue-on-error`, so the job does not fail on its own, and this step
      # decides the outcome from the two step outcomes instead.
      - name: Say that the store could not be reached
        if: >-
          always() && vars.INFISICAL_ENABLED == 'true' && env.HAS_INFISICAL == 'true'
            && (steps.login.outcome != 'success' || steps.grade.outcome != 'success')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          GRADE_OUTCOME: ${{ steps.grade.outcome }}
          AUTH_TITLE: "Env store health: CI cannot authenticate to the secrets store"
          CHECK_TITLE: "Env store health: the store did not answer"
        run: |
          set -uo pipefail

          # Two failures, two issues: they need different people. A 401 is a
          # credential to rotate; a failing `check` is a store to look at.
          if [ "${LOGIN_OUTCOME}" != "success" ]; then
            TITLE="$AUTH_TITLE"
          else
            TITLE="$CHECK_TITLE"
          fi

          {
            if [ "${LOGIN_OUTCOME}" != "success" ]; then
              echo "\`infisical login --method=universal-auth\` failed for the CI machine"
              echo "identity, so this workflow could not ask the store anything at all."
              echo
              echo "**This is not an Infisical outage** — it is our credential. The"
              echo "observed error is \`[status-code=401] [message=\"Invalid credentials\"]\`,"
              echo "which means \`INFISICAL_CLIENT_ID\` / \`INFISICAL_CLIENT_SECRET\` are"
              echo "wrong, revoked, or belong to an identity that has expired."
              echo
              echo "**Why it matters:** the chain that propagates a rotated credential to"
              echo "every client deployment runs through this store. While CI cannot"
              echo "authenticate, \`tasks/secret-rotation-runbook.md\` A.1 cannot be"
              echo "carried out, and nothing else in this repository would notice."
              echo
              echo "**To fix:** mint a new universal-auth identity in Infisical and update"
              echo "both repository secrets. Then run this workflow from the Actions tab"
              echo "to confirm, rather than waiting for tomorrow's schedule."
            else
              echo "The machine identity authenticated, and"
              echo "\`scripts/infisical-bootstrap.mjs check\` did not come back clean."
              echo
              echo "The job summary on the run below carries the exit code and the key"
              echo "names — exit 1 is an incomplete store (a backlog item), exit 3 is the"
              echo "store or the session being down (an incident)."
            fi
            echo
            echo "This check has been failing since it landed and reported nothing,"
            echo "because it had no failure-reporting step. It has one now, which is why"
            echo "you are reading this."
            echo
            echo "[This run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > /tmp/env-store-health.md

          cat /tmp/env-store-health.md >> "$GITHUB_STEP_SUMMARY"

          # One issue, commented on rather than duplicated: this runs daily, and
          # thirty identical issues for one unrotated credential is how a signal
          # gets muted.
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/env-store-health.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/env-store-health.md
          fi

      # The job's own verdict, after the reporting above has run. Without this
      # the `continue-on-error` on the two steps would leave a broken store
      # showing green in the Actions tab.
      - name: Fail the run when the store could not be reached
        if: >-
          always() && vars.INFISICAL_ENABLED == 'true' && env.HAS_INFISICAL == 'true'
            && (steps.login.outcome != 'success' || steps.grade.outcome != 'success')
        run: |
          echo "::error title=Env store unhealthy::login=${{ steps.login.outcome }} check=${{ steps.grade.outcome }} — see the issue this run opened."
          exit 1
