name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 03:00 UTC — catches newly disclosed vulns in already-merged deps.
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege defaults. Individual jobs may widen if strictly needed.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Full history is required so gitleaks can scan every commit on PRs,
          # not just the merge commit diff.
          fetch-depth: 0

      # NB: the official gitleaks-action@v2 wrapper requires a paid license for
      # organization repos. We run the gitleaks CLI binary directly instead —
      # same scan engine, no license needed.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        # --redact: never print secret values (only file/line). Exit code 1 on
        # any finding — fails the job as expected.
        run: gitleaks detect --source . --redact --verbose --no-banner

  pnpm-audit:
    name: pnpm audit (deps vulnerabilities)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (fail on high/critical, prod deps only)
        # `pnpm audit` walks the lockfile, so it already covers every workspace
        # (apps/*, packages/*) without --recursive
        # (which pnpm v10 doesn't accept on this command anyway).
        # --prod restricts the gate to deps that actually ship to users; lint
        # plugins, test runners and other dev tools are surfaced via local
        # `pnpm audit` runs but don't block PR merges.
        # --audit-level high → fails on `high` or `critical`, ignores
        # `low`/`moderate` noise.
        #
        # One advisory is silenced, in `pnpm.auditConfig.ignoreGhsas` at the root
        # package.json: GHSA-qq9h-g4jm-xgf3 (better-auth, CVSS 8.3). Not because
        # the risk is accepted — because the advisory's own preconditions are not
        # met here. It requires the magic-link OR email-OTP plugin to be enabled;
        # both apps configure `plugins: [convex({ authConfig })]` and nothing
        # else, and sign-in is emailAndPassword. Without a passwordless flow the
        # attack described has no first step. (The `magicLink` entry in
        # packages/core/src/auth/config.ts is an email subject line, in a file the
        # auth configs do not import.)
        #
        # It is silenced rather than fixed because it cannot be fixed today: the
        # patched range is >=1.6.22, and 1.6.22 through 1.6.30 all fail
        # type-check against @convex-dev/better-auth@0.12.5, the newest adapter
        # published.
        #
        # Remove the entry when EITHER holds:
        #   - a @convex-dev/better-auth release accepts better-auth >=1.6.22, or
        #   - anyone enables the magic-link or email-OTP plugin — at which point
        #     the advisory becomes real and this must go back to red.
        #
        # The entry is deliberately one GHSA. Verified narrow: with it in place,
        # dropping --prod still exits 1 on the other 11 high advisories.
        run: pnpm audit --prod --audit-level high
