name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 03:00 UTC — catches newly disclosed vulns in already-merged deps.
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege defaults. Individual jobs may widen if strictly needed.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Full history is required so gitleaks can scan every commit on PRs,
          # not just the merge commit diff.
          fetch-depth: 0

      # NB: the official gitleaks-action@v2 wrapper requires a paid license for
      # organization repos. We run the gitleaks CLI binary directly instead —
      # same scan engine, no license needed.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        # --redact: never print secret values (only file/line). Exit code 1 on
        # any finding — fails the job as expected.
        run: gitleaks detect --source . --redact --verbose --no-banner

  pnpm-audit:
    name: pnpm audit (deps vulnerabilities)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the issue below, and nothing else. Read-only everywhere it can be.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (fail on high/critical, prod deps only)
        # `pnpm audit` walks the lockfile, so it already covers every workspace
        # (apps/*, packages/*) without --recursive
        # (which pnpm v10 doesn't accept on this command anyway).
        # --prod restricts the gate to deps that actually ship to users; lint
        # plugins, test runners and other dev tools are surfaced via local
        # `pnpm audit` runs but don't block PR merges.
        # --audit-level high → fails on `high` or `critical`, ignores
        # `low`/`moderate` noise.
        #
        # One advisory is silenced, in `pnpm.auditConfig.ignoreGhsas` at the root
        # package.json: GHSA-qq9h-g4jm-xgf3 (better-auth, CVSS 8.3). Not because
        # the risk is accepted — because the advisory's own preconditions are not
        # met here. It requires the magic-link OR email-OTP plugin to be enabled;
        # both apps configure `plugins: [convex({ authConfig })]` and nothing
        # else, and sign-in is emailAndPassword. Without a passwordless flow the
        # attack described has no first step. (The `magicLink` entry in
        # packages/core/src/auth/config.ts is an email subject line, in a file the
        # auth configs do not import.)
        #
        # It is silenced rather than fixed because it cannot be fixed today: the
        # patched range is >=1.6.22, and 1.6.22 through 1.6.30 all fail
        # type-check against @convex-dev/better-auth@0.12.5, the newest adapter
        # published.
        #
        # Remove the entry when EITHER holds:
        #   - a @convex-dev/better-auth release accepts better-auth >=1.6.22, or
        #   - anyone enables the magic-link or email-OTP plugin — at which point
        #     the advisory becomes real and this must go back to red.
        #
        # The entry is deliberately one GHSA. Verified narrow: with it in place,
        # dropping --prod still exits 1 on the other 11 high advisories.
        run: pnpm audit --prod --audit-level high

      # Everything below only runs when the line above went red.
      #
      # The nightly schedule already worked: it failed at 07:22 on 02/09/2026,
      # two hours before the same advisory reached a feature branch and produced
      # two duplicate pull requests that had to be untangled by hand. What was
      # missing was not a signal — it was a signal anyone could act on without
      # re-deriving the fix. So say what broke and what closes it.
      - name: Say what is red, and what would close it
        if: failure()
        run: |
          set -uo pipefail
          # `--json` exits non-zero for the same reason the gate did.
          pnpm audit --prod --json > /tmp/audit.json || true
          node .github/scripts/audit-summary.mjs /tmp/audit.json >> "$GITHUB_STEP_SUMMARY"

      # A red scheduled run is a red dot in a tab nobody opens. An issue is not.
      #
      # `continue-on-error` on purpose: this organisation forbids Actions from
      # opening pull requests, and whether that policy extends to issues is not
      # something this repository can read (`orgs/.../actions/permissions`
      # answers 403 without `admin:org`). If it is refused, the job stays red on
      # its own merits and the summary above is still there — the fallback must
      # never be the thing that hides the finding.
      - name: Carry it to an issue, if the organisation allows one
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Audit: un avis high/critical bloque main"
        run: |
          set -uo pipefail
          {
            echo "L'audit nocturne est rouge sur \`main\` (\`${GITHUB_SHA:0:7}\`)."
            echo
            node .github/scripts/audit-summary.mjs /tmp/audit.json
            echo
            echo "[Le run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > /tmp/issue.md

          # One issue, reopened by comment rather than duplicated: a moving
          # advisory database produces this several days running.
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/issue.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/issue.md
          fi
