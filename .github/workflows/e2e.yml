name: E2E Tests

on:
  pull_request:
    branches:
      - main
  # And on `main` itself.
  #
  # A pull_request run tests `refs/pull/N/merge` — the base merged with the
  # head — which equals what lands only while the branch is up to date and the
  # merge is a squash. Neither is guaranteed, and as of 03/09/2026 neither is
  # even configured: the ruleset sets `strict_required_status_checks_policy:
  # false`, so branches are not required to be current, and `merge`, `squash`
  # and `rebase` are all permitted. What restores the guarantee is the merge
  # queue, which builds the prospective merged state and runs these same checks
  # against it — hence the `merge_group:` trigger below.
  #
  # So the suite now also runs on what was actually pushed. It gates nothing —
  # `E2E Status` is required on pull requests, and by the time this fires the
  # merge has happened — but a red mark on main is how a regression that only
  # appears once two branches meet gets noticed at all.
  push:
    branches:
      - main
  # The merge queue. It builds the prospective merged state of the batch and
  # asks these same jobs about it, so the checks branch protection requires have
  # to answer here too — a queue whose required checks never run is a queue that
  # never merges anything.
  merge_group:

concurrency:
  # One run per ref, and the older one loses.
  #
  # Two pushes to a branch used to start two full suites; the first became
  # useless the moment the second existed, and on the E2E workflow that is
  # twenty minutes of runner for an answer nobody will read. Branch protection
  # reads the most recent run for a given check name, so cancelling the stale
  # one cannot leave a required check red.
  #
  # `merge_group` is the exception: the queue is waiting on that run to decide
  # whether the batch may land, and a cancelled job is a failed one.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# Turborepo's remote cache, shared by every job here.
#
# `TURBO_TOKEN` is a Vercel access token and lives in the repository secrets;
# the team slug is not a secret — it is in the URL of every Vercel check on
# every pull request. Until the secret exists this block is inert, which was
# measured rather than hoped: an empty token exits 0, and an invalid one still
# ran 7 tasks out of 7 and fell back to the local cache. A misconfigured cache
# degrades; it does not break the build.
#
# What makes this safe is `globalDependencies: ["**/.env.*local"]` in
# turbo.json. The build bakes NEXT_PUBLIC_CONVEX_URL into the client bundle and
# into the CSP from it, and the e2e job builds with an `.env.local` the `Build`
# job does not have. Measured: no file `6fdf134d`, one URL `3aae56a1`, another
# `79edf744`. Three inputs, three keys — the e2e build cannot be served the CI
# one, which would produce an app with no backend and a global error boundary
# on every route.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: be-in-digital

jobs:
  e2e:
    name: E2E Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Four shards, each with its own Convex backend and its own Next server.
    #
    # The suite is 541 tests at one worker — 16 minutes of Playwright inside a
    # 20-minute job, and `strict`-serialised merges meant a batch of three paid
    # that three times over. One worker is not negotiable: two of them share a
    # single server and a single deployment, and the contention shows up as
    # tests failing on a shell that had not rendered. Sharding buys the
    # parallelism that a second worker cannot, because each shard is a whole
    # machine — separate server, separate backend, separate database.
    #
    # `fail-fast: false` on purpose: one shard failing must not cancel the other
    # three, or the report says nothing about two thirds of the suite. The
    # sharded run is also *more* isolated than the single one it replaces — the
    # cross-file state that `order-service-types` and `store-global-hours` share
    # today lands on two different backends.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Measured, not estimated: a healthy shard runs ~15 minutes end to end
    # (02:17:56 -> 02:32:45 on the run that first went red), of which ~3 are the
    # Convex push. The push is retried up to three times, and its own ceiling is
    # 5 minutes, so a bad day can add ~12 minutes to that 15. 30 left no room
    # for the retries to finish; 40 does, and still stops a genuinely hung shard
    # from holding the queue for an hour.
    timeout-minutes: 40

    env:
      # ── The backend under test ────────────────────────────────────────────
      #
      # This job used to be gated on `vars.CONVEX_E2E_ENABLED == 'true'` with a
      # set of E2E_* secrets pointing at a hosted Convex deployment. Neither the
      # variable nor the secrets were ever created, so the job was skipped on
      # every run since it was written, and `E2E Status` reported that skip as
      # success. Eight consecutive CI runs finished in 7-11 seconds and were
      # believed.
      #
      # So the deployment is no longer somebody's to provision: the job starts
      # its own Convex backend on the runner, from the published binary, with no
      # account and no secrets. Nothing here is privileged, and nothing here can
      # be left unset by mistake.
      CONVEX_BACKEND_VERSION: precompiled-2026-08-25-7cce8fb
      CONVEX_PORT: "3310"
      CONVEX_SITE_PORT: "3311"
      CONVEX_INSTANCE: beyours-e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @beyours/reference exec playwright install --with-deps chromium

      - name: Cache the Convex backend binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/convex-e2e
          key: convex-backend-${{ env.CONVEX_BACKEND_VERSION }}

      - name: Start a Convex backend
        run: |
          set -euo pipefail

          BIN_DIR="$HOME/.cache/convex-e2e"
          BIN="$BIN_DIR/convex-local-backend"

          if [ ! -x "$BIN" ]; then
            mkdir -p "$BIN_DIR"
            # Same artifact the Convex CLI downloads for a local deployment.
            # Pinned rather than "latest": the suite should fail because the
            # product changed, never because the backend did overnight.
            URL="https://github.com/get-convex/convex-backend/releases/download/${CONVEX_BACKEND_VERSION}/convex-local-backend-x86_64-unknown-linux-gnu.zip"
            echo "Downloading $URL"
            curl -fsSL --retry 3 -o /tmp/convex-backend.zip "$URL"
            unzip -q -o /tmp/convex-backend.zip -d "$BIN_DIR"
            chmod +x "$BIN"
          fi

          STATE="$HOME/convex-e2e-state"
          mkdir -p "$STATE/storage"

          SECRET="$(openssl rand -hex 32)"
          ADMIN_KEY="$("$BIN" keygen admin-key \
            --instance-name "$CONVEX_INSTANCE" --instance-secret "$SECRET" | tail -1)"

          cd "$STATE"
          nohup "$BIN" \
            --port "$CONVEX_PORT" --site-proxy-port "$CONVEX_SITE_PORT" \
            --instance-name "$CONVEX_INSTANCE" --instance-secret "$SECRET" \
            --local-storage storage backend.sqlite3 \
            > "$HOME/convex-backend.log" 2>&1 &

          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${CONVEX_PORT}/version" > /dev/null 2>&1; then
              echo "Backend up after ${i}s"
              break
            fi
            sleep 1
          done

          if ! curl -sf "http://127.0.0.1:${CONVEX_PORT}/version" > /dev/null 2>&1; then
            echo "::error::The Convex backend never came up. Log follows."
            cat "$HOME/convex-backend.log"
            exit 1
          fi

          # Consumed by every later step. Never printed: it is an admin key, and
          # it is worth exactly one ephemeral runner.
          echo "::add-mask::$ADMIN_KEY"
          echo "CONVEX_SELF_HOSTED_URL=http://127.0.0.1:${CONVEX_PORT}" >> "$GITHUB_ENV"
          echo "CONVEX_SELF_HOSTED_ADMIN_KEY=$ADMIN_KEY" >> "$GITHUB_ENV"

      - name: Write the suite's environment
        run: |
          set -euo pipefail

          # .env.local, and written to a file rather than exported into the job.
          #
          # A file, because `pnpm test:e2e` runs through Turborepo, whose strict
          # env mode drops every variable not named in turbo.json's
          # passThroughEnv — and the web server it spawns refuses to serve
          # without the required tier.
          #
          # .env.local specifically, because four different consumers have to
          # agree and it is the only name all four read: `next build` bakes
          # NEXT_PUBLIC_CONVEX_URL into the client bundle and into the CSP from
          # it, `next start` reads it at runtime, and playwright.config.ts and
          # scripts/seed-users.mts both load it through loadEnvFiles. Writing
          # .env.e2e instead builds an app with no backend URL, which serves the
          # global error boundary on every route and fails the auth setup with
          # "element(s) not found" — measured, not guessed.
          #
          # CONVEX_DEPLOYMENT is deliberately absent: the Convex CLI refuses to
          # run when it is set alongside CONVEX_SELF_HOSTED_URL.
          cat > apps/reference/.env.local <<EOF
          NEXT_PUBLIC_CONVEX_URL=http://127.0.0.1:${CONVEX_PORT}
          NEXT_PUBLIC_CONVEX_SITE_URL=http://127.0.0.1:${CONVEX_SITE_PORT}
          CONVEX_SITE_URL=http://127.0.0.1:${CONVEX_SITE_PORT}
          BETTER_AUTH_SECRET=$(openssl rand -hex 32)
          BETTER_AUTH_URL=http://localhost:3000
          ENCRYPTION_KEY=$(openssl rand -hex 32)
          EMAIL_API_SECRET=e2e-email-api-secret-not-for-production
          SITE_URL=http://localhost:3000
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          ADMIN_URL=http://localhost:3000
          AUTH_ALLOW_UNVERIFIED_EMAIL=true
          AWS_REGION=eu-west-3
          AWS_ACCESS_KEY_ID=placeholder
          AWS_SECRET_ACCESS_KEY=placeholder
          AWS_S3_BUCKET_NAME=placeholder-bucket
          AWS_SES_FROM_EMAIL=e2e@placeholder.invalid
          AWS_SES_FROM_NAME="BeYours E2E"
          AWS_SES_REPLY_TO_EMAIL=e2e@placeholder.invalid
          OPENAI_API_KEY=sk-placeholder
          SEED_ADMIN_EMAIL=test.owner@beindigital.fr
          SEED_PASSWORD=e2e-seed-password-not-for-production
          EOF

          # Nothing above reaches S3, SES or OpenAI. They only have to be
          # present and well-formed: instrumentation.ts validates the required
          # tier at startup and refuses to serve without it.
          echo "Wrote apps/reference/.env.local ($(grep -c . apps/reference/.env.local) values)"

      - name: Build application
        # The e2e suite targets the reference app: no need to build the
        # commercial site or the client template here.
        #
        # Before the Convex deploy, not after. `convex deploy` bundles
        # apps/reference/convex, which imports @be-in-digital/cms and friends,
        # and those are workspace packages consumed from `dist` — which does not
        # exist until this step builds them. A fresh runner has never built
        # them, so deploying first fails with "Could not resolve
        # @be-in-digital/cms ... ./dist/index.mjs was not found". Every local
        # run had a dist lying around from an earlier build and never saw it.
        run: pnpm build --filter=@beyours/reference...

      - name: Deploy Convex functions
        working-directory: apps/reference
        run: |
          set -euo pipefail

          # Retried, because this push runs uncomfortably close to a ceiling we
          # do not control.
          #
          # `evaluate_push` is answered by the local backend, which gives up
          # after 5 minutes and returns 408. Neither the CLI nor the backend
          # binary exposes a flag to raise it. Measured on the run that first
          # went red: shards 2, 3 and 4 pushed in 2m30s, 3m16s and 3m03s, and
          # shard 1 — queued 17 minutes later, so on a busier runner — hit
          # 5m02s and failed. Nothing about shard 1 differs; `matrix.shard` is
          # read only by the Playwright command further down. It was simply the
          # one that ran slowest on the day.
          #
          # A cold backend evaluates all 108 convex modules from scratch, and
          # every shard starts its own. The same push against a warm backend
          # takes 4-5 seconds, so a retry is not a superstition: the attempt
          # that timed out leaves evaluated modules cached, and the next one
          # starts from there.
          #
          # This is a margin problem, not a flake. If the retries start being
          # needed routinely, the push has outgrown the ceiling and the module
          # graph is what has to change.
          deploy_attempt() {
            npx convex deploy -y --typecheck disable
          }

          ATTEMPTS=3
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "::group::convex deploy (attempt $attempt/$ATTEMPTS)"
            START=$(date +%s)
            if deploy_attempt; then
              echo "Deployed in $(( $(date +%s) - START ))s on attempt $attempt"
              echo "::endgroup::"
              break
            fi
            echo "Attempt $attempt failed after $(( $(date +%s) - START ))s"
            echo "::endgroup::"

            if [ "$attempt" -eq "$ATTEMPTS" ]; then
              # The backend log was only ever printed when the backend failed to
              # start, so a push that timed out left nothing to diagnose from.
              echo "::error::convex deploy failed $ATTEMPTS times. Backend log follows."
              tail -200 "$HOME/convex-backend.log" || true
              echo "--- backend still answering? ---"
              curl -sS -o /dev/null -w "GET /version -> %{http_code} in %{time_total}s\n" \
                "http://127.0.0.1:${CONVEX_PORT}/version" || echo "no answer"
              exit 1
            fi
            sleep 5
          done

          # Read by Convex functions, so they live on the deployment and not in
          # the env file above. Without the first, sign-in answers 403 and every
          # admin test fails on an empty session.
          npx convex env set AUTH_ALLOW_UNVERIFIED_EMAIL true
          npx convex env set SITE_URL http://localhost:3000

      - name: Seed test users
        working-directory: apps/reference
        run: |
          set -euo pipefail

          # `pnpm start`, not `pnpm dev`: the build the previous step produced is
          # right there, and a dev server would recompile every route on demand
          # — including /api/auth/sign-up/email, on the seed's first request,
          # after the readiness poll below has already declared the server up.
          # It also runs the same NODE_ENV as the suite will.
          # Job control on, so the background job becomes its own process group
          # leader and the whole tree can be killed by group below.
          set -m
          pnpm start &
          SERVER_PID=$!

          echo "Waiting for the server..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          # No `|| true`. The seed is idempotent — it signs existing accounts in
          # rather than failing on them — so the only thing that trailing `|| true`
          # ever hid was a seed that could not run at all. It hid exactly that:
          # `tsx` was in no package.json, so the command was never found, and the
          # suite went on to test an empty database.
          seed_status=0
          npx tsx scripts/seed-users.mts || seed_status=$?

          # `pnpm start` is a wrapper: the process actually holding :3000 is the
          # `next start` it spawned, and killing the wrapper leaves it serving.
          # Playwright then refuses to bring up its own web server with
          # "http://localhost:3000 is already used" and the whole suite reports
          # zero tests — which is what happened here twice.
          #
          # Kill the process group, and use curl rather than lsof to decide
          # whether it worked: lsof is not guaranteed on a runner, and
          # `if lsof ...` on a missing binary exits 127, which reads as "port is
          # free" and silently passes. curl answers the only question that
          # matters — is anything still serving on 3000 — and needs nothing
          # installed.
          kill -- "-$SERVER_PID" 2>/dev/null || kill "$SERVER_PID" 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          for _ in $(seq 1 20); do
            curl -s --max-time 2 http://localhost:3000 > /dev/null 2>&1 || break
            pkill -f "next start" 2>/dev/null || true
            pkill -f "next-server" 2>/dev/null || true
            sleep 1
          done

          if curl -s --max-time 2 http://localhost:3000 > /dev/null 2>&1; then
            echo "::error::Something is still serving on port 3000 after the seed. Playwright cannot start its own server, and the run would report zero tests."
            exit 1
          fi
          echo "Port 3000 is free."

          if [ "$seed_status" -ne 0 ]; then
            echo "::error::Seeding failed (exit $seed_status). The admin suite signs in as a seeded account, so running it now would report defects that are only missing fixtures."
            exit "$seed_status"
          fi

      - name: Run Playwright tests
        # `--` hands the rest to Playwright through Turbo, which is verified:
        # `-- --list --shard=2/4` reports 138 tests in 11 files.
        #
        # `blob` rather than html+json: a shard's own report describes a quarter
        # of the suite, and the assertion below needs the whole of it. The blobs
        # are merged in `e2e-report`, which is also where the report a human
        # opens is produced.
        run: >
          pnpm test:e2e --filter=@beyours/reference --
          --shard=${{ matrix.shard }}/4 --reporter=blob
        env:
          CI: true

      - name: Upload this shard's blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/reference/blob-report/
          retention-days: 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: apps/reference/test-results/
          retention-days: 7

      - name: Convex backend log
        if: failure()
        run: tail -100 "$HOME/convex-backend.log" || true

  # One report out of four shards, and the assertion that the run happened.
  #
  # `assert-e2e-ran.mjs` demands `setup`, `public` and `admin` in one report and
  # a floor of 100 tests. Neither holds for a quarter of the suite: a shard can
  # legitimately contain no `public` test at all, and would fail an assertion it
  # never had any way to satisfy. Run against the merged report it means exactly
  # what it meant before sharding, which is the point of merging.
  #
  # `always()`, because a failed shard is precisely when the report is worth
  # having.
  e2e-report:
    name: E2E Report
    runs-on: ubuntu-latest
    needs: [e2e]
    if: always()
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect every shard's blob
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: apps/reference/all-blob-reports

      - name: Merge them into one report
        working-directory: apps/reference
        # The JSON lands outside `playwright-report/`: the html reporter owns
        # that directory and empties it, and the assertion needs a file that
        # survives being written next to it.
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-report.json
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports

      - name: Prove the suite actually ran
        # Playwright exits 0 when it has nothing to run, and this config can end
        # up with nothing to run without saying so: `setup` and `admin` are
        # spread out of the projects array when NEXT_PUBLIC_CONVEX_URL looks
        # like a placeholder, which removes 43 of 56 spec files from the run AND
        # from the report. A green tick over an empty run is the failure this
        # whole job exists to stop, so it is asserted rather than assumed.
        #
        # Floors per project, not one global number.
        #
        # A single `--min 100` against a 542-test suite was measured to accept
        # 442 of them going missing: replaying this job over one shard's blob
        # instead of four gave 135 tests, all three projects present, exit 0.
        # Four shards means a quarter of the suite is one artifact, and
        # `upload-artifact` treats "no files found" as a warning, so "some of
        # the run is missing" is the shape a real failure takes here.
        #
        # Measured on run 33750984671: setup 4, public 75, admin 463 — 542. The
        # floors sit below that with room for the ~62 tests that can legitimately
        # self-skip on thin fixtures (9 did on that run), and above what any
        # three shards can produce, so losing one blob fails.
        run: |
          node scripts/assert-e2e-ran.mjs \
            apps/reference/merged-report.json \
            --min 400 --projects setup:1,public:60,admin:380

      - name: Upload the merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/reference/playwright-report/
          retention-days: 7

  # Reports what the E2E job actually did.
  #
  # Every outcome that is not a real pass fails here. `skipped` used to be
  # excused, because the suite was switched off by default and branch protection
  # should not block a PR over a suite the repository had not enabled — but the
  # suite is no longer switched off, so a skip now means the job did not run
  # when it should have, and that is a failure like any other.
  e2e-status:
    name: E2E Status
    runs-on: ubuntu-latest
    needs: [e2e, e2e-report]
    if: always()
    steps:
      - name: Check E2E result
        env:
          # A matrix result is the aggregate: `success` only when all four
          # shards succeeded.
          E2E_RESULT: ${{ needs.e2e.result }}
          # And the report job carries the assertion that the run was real, so a
          # gate that ignored it would go green over an empty suite again.
          REPORT_RESULT: ${{ needs.e2e-report.result }}
        run: |
          if [ "$E2E_RESULT" = "success" ] && [ "$REPORT_RESULT" = "success" ]; then
            echo "E2E tests passed"
            exit 0
          fi
          if [ "$E2E_RESULT" = "success" ]; then
            echo "::error::The shards passed but the report did not (job result: $REPORT_RESULT)"
            exit 1
          fi
          # failure, cancelled, skipped, or whatever a future runner reports.
          # None of them mean the suite passed. `cancelled` used to land in the
          # same branch as success and be announced as one.
          echo "::error::E2E tests did not pass (job result: $E2E_RESULT)"
          exit 1
