name: E2E Tests

on:
  pull_request:
    branches:
      - main

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip E2E when no real Convex backend is configured
    if: vars.CONVEX_E2E_ENABLED == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/restaurant-theme
        run: pnpm exec playwright install --with-deps chromium

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-e2e-

      - name: Build application
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.E2E_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ secrets.E2E_CONVEX_SITE_URL }}
        run: pnpm build

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          CI: true
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.E2E_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ secrets.E2E_CONVEX_SITE_URL }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/restaurant-theme/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/restaurant-theme/test-results/
          retention-days: 7

  # Always-passing job so branch protection rules don't block PRs
  e2e-status:
    name: E2E Status
    runs-on: ubuntu-latest
    needs: [e2e]
    if: always()
    steps:
      - name: Check E2E result
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$E2E_RESULT" = "skipped" ]; then
            echo "E2E tests skipped — set CONVEX_E2E_ENABLED=true in repo vars to enable"
          elif [ "$E2E_RESULT" = "failure" ]; then
            echo "E2E tests failed"
            exit 1
          else
            echo "E2E tests passed"
          fi
