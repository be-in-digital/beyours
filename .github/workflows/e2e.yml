name: E2E Tests

on:
  pull_request:
    branches:
      - main

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip E2E when no real Convex backend is configured
    if: vars.CONVEX_E2E_ENABLED == 'true'
    env:
      # Site-level (dedicated Convex test deployment)
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.E2E_NEXT_PUBLIC_CONVEX_URL }}
      CONVEX_SITE_URL: ${{ secrets.E2E_CONVEX_SITE_URL || 'https://placeholder.convex.site' }}
      CONVEX_DEPLOYMENT: ${{ secrets.E2E_CONVEX_DEPLOYMENT }}
      BETTER_AUTH_SECRET: ${{ secrets.E2E_BETTER_AUTH_SECRET || 'ci-placeholder-secret-not-for-production' }}
      BETTER_AUTH_URL: http://localhost:3000
      ENCRYPTION_KEY: ${{ secrets.E2E_ENCRYPTION_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
      # Throwaway password for seeded E2E test accounts (never used in production)
      SEED_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD || 'ci-seed-password-not-for-prod' }}
      # Package-level (BeInDigital infrastructure)
      AWS_REGION: ${{ secrets.E2E_AWS_REGION || 'eu-west-3' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID || 'placeholder' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY || 'placeholder' }}
      OPENAI_API_KEY: ${{ secrets.E2E_OPENAI_API_KEY || 'sk-placeholder' }}
    steps:
      # Before anything is installed or built: if this job is running at all,
      # the flag says E2E is wanted, and E2E without a backend cannot happen.
      # Discovering that after `pnpm build` used to cost five minutes and end
      # in a green check.
      - name: Require a backend to test against
        run: |
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "::error::CONVEX_E2E_ENABLED is true but E2E_NEXT_PUBLIC_CONVEX_URL is unset."
            echo "Playwright cannot run without a deployment to point at."
            echo "Set the E2E_* secrets, or unset CONVEX_E2E_ENABLED to skip E2E honestly."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @beyours/reference exec playwright install --with-deps chromium

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-e2e-

      - name: Build application
        # The e2e suite targets the reference app: no need to build the
        # commercial site or the client template here.
        run: pnpm build --filter=@beyours/reference...

      - name: Seed test users
        working-directory: apps/reference
        run: |
          # Start dev server in background for seeding
          pnpm dev &
          DEV_PID=$!

          # Wait for server to be ready
          echo "Waiting for dev server..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Dev server ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Run seed (idempotent - skips existing users)
          npx tsx scripts/seed-users.mts || true

          # Stop dev server
          kill $DEV_PID 2>/dev/null || true
          wait $DEV_PID 2>/dev/null || true

      - name: Run Playwright tests
        run: pnpm test:e2e --filter=@beyours/reference
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/reference/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/reference/test-results/
          retention-days: 7

  # Reports what the E2E job actually did.
  #
  # It still passes when E2E is switched off, so branch protection does not
  # block a PR over a suite the repository has not enabled - but only then. Any
  # other outcome that is not a real pass fails: a run that produced no test
  # result is not a pass, and saying so was the whole problem.
  e2e-status:
    name: E2E Status
    runs-on: ubuntu-latest
    needs: [e2e]
    if: always()
    steps:
      - name: Check E2E result
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          case "$E2E_RESULT" in
            skipped)
              echo "E2E tests skipped — set CONVEX_E2E_ENABLED=true in repo vars to enable"
              ;;
            success)
              echo "E2E tests passed"
              ;;
            *)
              # failure, cancelled, or whatever a future runner reports. None of
              # them mean the suite passed. `cancelled` used to land in the same
              # branch as success and be announced as one.
              echo "::error::E2E tests did not pass (job result: $E2E_RESULT)"
              exit 1
              ;;
          esac
