name: Mirror health

# Is `be-in-digital/beyours-boilerplate` carrying what `apps/themes` says it
# should — and if the last sync did not finish, does anybody know?
#
# WHY THIS IS A SECOND WORKFLOW. `publish-mirror.yml` cannot answer either
# question about itself.
#
#   - A run that ends `cancelled` runs NOTHING. Not an `if: failure()` step, not
#     an `if: always()` job — a cancelled run has no steps left to execute. So
#     the one conclusion that is neither a pass nor a failure is also the one
#     conclusion the workflow cannot report on from inside.
#   - And `cancelled` is not rare here. `publish-mirror.yml` carries
#     `concurrency: publish-mirror` with the default `cancel-in-progress: false`,
#     which queues rather than cancels the RUNNING job — but GitHub still
#     cancels a PENDING run the moment a third joins the group. It is also what
#     a human does to a stalled job, which is the twelve-day incident recorded
#     in that file's `timeout-minutes` comment: pnpm hit a version it could not
#     switch to, hung, somebody cancelled it fifty minutes later, and no run
#     ever said the mirror had stopped syncing.
#
# The measured cost of the same blind spot, one incident later: #402's security
# floors reached no client for 90 minutes, and only a manual dispatch fixed it.
# Nothing was broken — nothing was WATCHING.
#
# IT RETRIES, ONCE, AND THEN REPORTS. An earlier draft of this file said a
# retry was impossible without a PAT, on the grounds that an event created with
# `GITHUB_TOKEN` does not trigger another workflow run. That is the rule, but
# `workflow_dispatch` and `repository_dispatch` are its two documented
# exceptions — and a retry of `Publish mirror` is exactly a `workflow_dispatch`,
# on THIS repository, which `GITHUB_TOKEN` may create given
# `permissions: actions: write`. `MIRROR_PUSH_TOKEN` never came into it: the
# dispatch happens here, not on the boilerplate.
#
# Once, and the bound is what makes it safe. The retry fires only for a run that
# was NOT itself a dispatch, so a retried run that is cancelled again reports
# rather than looping. If the dispatch is refused — an organisation policy, a
# token GitHub has narrowed — the step is `continue-on-error` and the issue is
# opened anyway: the fallback must never be the thing that hides the finding.
#
# The `--check` half is not new code: `scripts/publish-mirror.mjs --check`
# already clones the mirror, materialises the tree that would be published and
# exits 1 on drift. It existed and ran only when a human asked it to.

on:
  # The observer. Fires on EVERY conclusion of a Publish mirror run, including
  # the two that workflow cannot report on itself.
  workflow_run:
    workflows: ["Publish mirror"]
    types: [completed]

  # The backstop. A cancelled run is one way the mirror goes stale; a sync that
  # succeeded against the wrong tree, a push that never triggered, and a
  # `paths:` filter that missed an input are others, and none of them produces a
  # non-success conclusion to observe.
  #
  # 05:40 UTC: after the nightly security scan (03:00) and before the env-store
  # health check (06:15), off the hour because everyone else's cron is on it.
  schedule:
    - cron: "40 5 * * *"

  workflow_dispatch:

# Serialised against nothing else: this workflow only reads. It must not join
# `publish-mirror`'s group, or a sync in flight would cancel the very check
# that reports cancellations.
concurrency:
  group: mirror-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── The observer ───────────────────────────────────────────────────────────
  # IS ANY OF THIS WORTH REPORTING TODAY?
  #
  # `stale` and `release-waiting` both measure distance from the registry: is
  # the boilerplate carrying what `apps/themes` says, and has a merged bump gone
  # unpublished. While `RELEASE_HOLD.md` is in the tree both answers are yes BY
  # DESIGN — the hold is the thing stopping the publish, and the mirror stands
  # down behind it — so a daily issue on each would report the decision back to
  # the people who took it.
  #
  # That is the failure this whole workflow exists to avoid, pointed the other
  # way: an alert nobody can act on is an alert everybody learns to mute, and a
  # muted channel is how the twelve-day outage in `publish-mirror.yml` stayed
  # invisible. So the two distance checks stand down; `inconclusive` and
  # `mirror-ci` do not, because a cancelled run and a broken mirror CI are just
  # as real during a hold as outside one.
  hold:
    name: Is publication held?
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      held: ${{ steps.hold.outputs.held }}
    steps:
      - uses: actions/checkout@v4
      - id: hold
        run: node scripts/check-release-hold.mjs --report

  inconclusive:
    name: Report an unfinished sync
    if: >-
      ${{ github.event_name == 'workflow_run'
        && github.event.workflow_run.head_branch == 'main'
        && (github.event.workflow_run.conclusion == 'cancelled'
          || github.event.workflow_run.conclusion == 'failure'
          || github.event.workflow_run.conclusion == 'timed_out') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # The retry below. `GITHUB_TOKEN` may create a `workflow_dispatch` — one
      # of the two documented exceptions to "events from GITHUB_TOKEN do not
      # start workflows" — and this is what lets it.
      actions: write
    steps:
      - uses: actions/checkout@v4

      # ── Is there anything left to report? ────────────────────────────────
      #
      # A `cancelled` conclusion is usually not news. `publish-mirror.yml`
      # carries `concurrency: publish-mirror`, so a run of it is cancelled
      # whenever a third joins the group — and a busy hour on `main` does that
      # several times over. If a LATER run for the same commit went on to
      # succeed, the cancellation carried no information about the mirror at
      # all, and reporting it buries the one conclusion that did.
      #
      # Measured on #478: four comments in fifty minutes, three of them about
      # superseded runs. Noise on a staleness alarm is not harmless — it is how
      # the alarm stops being read.
      #
      # `gh run list --commit` needs `actions: read`, which `actions: write`
      # below already includes. A lookup that fails leaves `superseded` empty
      # and the report goes ahead: not knowing is a reason to speak, never a
      # reason to stay quiet.
      - name: Did a later run for this commit already succeed?
        id: superseded
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # Through the environment, like everything else here: a `${{ }}` a
          # shell expands is a `${{ }}` a shell can be surprised by, and the
          # file's own convention is worth more than the two lines it saves.
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -uo pipefail
          runs=$(gh run list --workflow=publish-mirror.yml --commit "$RUN_SHA" \
            --json databaseId,status,conclusion --limit 50 2>/dev/null || echo "[]")

          # ANY successful run for this commit, earlier or later.
          #
          # The mirror is keyed on the COMMIT, not on run order: a successful
          # run pushed THAT tree, and a cancellation afterwards cannot unpush
          # it. The lookup used to demand `.databaseId > RUN_ID`, and #508 is
          # what that cost — `aea6981` was published by run 34881631905 at
          # 18:34, a `workflow_run` for the same commit was cancelled at 18:45,
          # and the observer reported a stale mirror that was already current.
          # `conclusion == "success"` stays the test; only the ordering goes.
          succeeded=$(echo "$runs" \
            | jq "[.[] | select(.conclusion == \"success\")] | length" 2>/dev/null || echo 0)

          # A LATER run for this commit that has not finished.
          #
          # This one must stay ordered: an unfinished run will reach its own
          # conclusion and be observed in its turn, so the last run of a burst
          # always reports and no cancellation is swallowed. Without it the
          # observer reports every link in a chain it is itself forging — the
          # retry below joins `concurrency: publish-mirror`, cancels the run
          # already in flight, and that cancellation dispatches another retry.
          # Measured on `38b76bd6`: four runs, three of them cancelled by their
          # own successor, on a commit whose sync went on to succeed.
          in_flight=$(echo "$runs" \
            | jq "[.[] | select(.status != \"completed\" and .databaseId > ${RUN_ID})] | length" 2>/dev/null || echo 0)

          if [ "${succeeded:-0}" -gt 0 ] || [ "${in_flight:-0}" -gt 0 ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            if [ "${succeeded:-0}" -gt 0 ]; then
              reason="another run for the same commit succeeded, so the mirror carries this tree"
            else
              reason="a later run for the same commit is still going, and will report its own conclusion"
            fi
            {
              echo "### Nothing to report"
              echo
              echo "A \`Publish mirror\` run for \`${RUN_SHA:0:7}\` ended"
              echo "\`${CONCLUSION}\`, but ${reason}."
              echo
              echo "The concurrency group cancels a queued run whenever a third joins it, so"
              echo "this is the ordinary shape of a busy hour on \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Was it refused, or did it not finish? ────────────────────────────
      #
      # These need different words and different actions, and reporting them
      # the same way is what made #478 unreadable.
      #
      # `cancelled` and `timed_out` mean no step reached a verdict: the run was
      # superseded, killed, or hung. Re-running is exactly right.
      #
      # `failure` means a step RAN and REFUSED. Re-running hits the same
      # refusal — and the commonest refusal here is one no re-run can ever
      # clear: `mirror-typecheck.mjs` compiling the staged template against the
      # engine versions the REGISTRY serves, and finding a symbol that only
      # exists in the workspace. That is the deadlock #427 and #389 are about,
      # and its fix is a release. #478 dispatched four retries into it.
      #
      # The publisher already writes the diagnosis; this reads it back out of
      # the run it is reporting on rather than paraphrasing it, so the two
      # cannot drift apart.
      - name: What did the failed run say?
        id: diagnosis
        if: github.event.workflow_run.conclusion == 'failure' && steps.superseded.outputs.superseded != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail
          gh run view "$RUN_ID" --log-failed > /tmp/failed.log 2>/dev/null || true
          # The line `mirror-typecheck.mjs` prints, and only it, when the staged
          # tree needs a symbol the pinned version does not carry.
          if grep -q "would NOT compile for a client" /tmp/failed.log; then
            echo "cause=pinned-versions" >> "$GITHUB_OUTPUT"
          else
            echo "cause=unknown" >> "$GITHUB_OUTPUT"
          fi

      # Retry once, and only for a conclusion a retry can change: `cancelled`
      # or `timed_out`, from a run that was not itself a dispatch — so a
      # retried run cancelled a second time reports instead of looping.
      # `continue-on-error` because a refused dispatch must not stop the issue
      # below from being opened.
      - name: Re-run the sync, once
        id: retry
        continue-on-error: true
        if: >-
          ${{ github.event.workflow_run.event != 'workflow_dispatch'
            && github.event.workflow_run.conclusion != 'failure'
            && steps.superseded.outputs.superseded != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run publish-mirror.yml --ref main
          echo "retried=true" >> "$GITHUB_OUTPUT"

      # Same shape as `security.yml`'s nightly issue, and `continue-on-error`
      # for the same reason: this organisation forbids Actions from opening pull
      # requests, and whether that extends to issues is not something this
      # repository can read. If it is refused, the step summary below is still
      # written and the job is still visible in the Actions tab — the fallback
      # must never be the thing that hides the finding.
      - name: Say that the mirror may be stale
        if: steps.superseded.outputs.superseded != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Publish mirror: a sync did not finish"
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RETRIED: ${{ steps.retry.outputs.retried }}
          RETRY_OUTCOME: ${{ steps.retry.outcome }}
          CAUSE: ${{ steps.diagnosis.outputs.cause }}
        run: |
          set -uo pipefail
          {
            echo "A \`Publish mirror\` run on \`main\` ended **${CONCLUSION}**, so"
            echo "\`be-in-digital/beyours-boilerplate\` may not carry \`${RUN_SHA:0:7}\`."
            echo
            if [ "${CONCLUSION}" = "failure" ]; then
              echo "The run reached a verdict and refused. This report comes from another"
              echo "workflow because the same observer watches for \`cancelled\`, which a"
              echo "run cannot report on itself — a cancelled run executes no step at all."
            else
              echo "\`cancelled\` is neither a pass nor a failure, and a cancelled run"
              echo "executes no step of its own — which is why this report comes from"
              echo "another workflow."
            fi
            echo
            if [ "${CAUSE:-}" = "pinned-versions" ]; then
              echo "**No retry was dispatched, and none would help.** That run did not"
              echo "stop short — it compiled the staged template against the engine"
              echo "versions the **registry** serves and found a symbol that exists only"
              echo "in this workspace. Every sync is refused until a release carries it,"
              echo "including changes by other people that have nothing to do with the"
              echo "one that blocked it."
              echo
              echo "**Recover by cutting a release.** \`pnpm check:pending-release\` says"
              echo "whether a changeset for the package the error names is already"
              echo "waiting; merge it and let Release publish, or write one if there is"
              echo "none. The sync then goes on its own. Read the \`Sync\` step of the run"
              echo "below for the package and the symbol."
              echo
              echo "Do **not** remove the import to get past it. The import is correct and"
              echo "the pinned version is what is behind — removing it delivers a template"
              echo "missing whatever it was reaching for, and the gate goes green over a"
              echo "product that lost a feature."
            elif [ "${CONCLUSION}" = "failure" ]; then
              echo "**No retry was dispatched.** A step ran and refused, so re-running"
              echo "reaches the same refusal. Read the \`Sync\` step of the run below:"
              echo "whatever it names is what has to change."
            elif [ "${RETRIED:-}" = "true" ]; then
              echo "**A retry has been dispatched.** Check the Actions tab: if that run"
              echo "goes green the mirror is current again and this issue can be closed."
              echo "It is dispatched once only — a retry that is itself cancelled is"
              echo "reported, not retried again."
            elif [ "${RETRY_OUTCOME:-}" = "failure" ]; then
              echo "**The automatic retry was refused** (\`gh workflow run\` failed), so"
              echo "nothing has re-run. **Recover by hand:** run \`Publish mirror\` from"
              echo "the Actions tab on \`main\`. Tick *Dry run* first if you want the"
              echo "drift listed before anything is pushed."
            else
              echo "**No retry was dispatched** — this run was already a manual retry."
              echo "**Recover by hand:** run \`Publish mirror\` from the Actions tab on"
              echo "\`main\`. Tick *Dry run* first if you want the drift listed before"
              echo "anything is pushed."
            fi
            echo
            echo "[The run that did not finish](${RUN_URL})"
            echo
            echo "[This report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > /tmp/mirror-health.md

          cat /tmp/mirror-health.md >> "$GITHUB_STEP_SUMMARY"

          # One issue, commented on rather than duplicated: a busy day on `main`
          # can cancel several queued runs in a row, and five identical issues
          # are read as noise and muted.
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/mirror-health.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/mirror-health.md
          fi

  # ── The backstop ───────────────────────────────────────────────────────────
  stale:
    name: Is the mirror current?
    needs: [hold]
    # Held means this measures a deliberate state — see the `hold` job.
    if: github.event_name != 'workflow_run' && needs.hold.outputs.held != 'true'
    runs-on: ubuntu-latest
    # `--check` does the whole gate before it compares: it clones the mirror,
    # pins the engine versions the registry serves, installs them and
    # typechecks the staged tree. Measured warm at a few minutes; the ceiling is
    # a stall detector, and one a healthy run cannot approach is the only kind
    # that detects anything.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@be-yours"
          cache: "pnpm"

      # CAN THIS JOB EVEN ASK THE QUESTION?
      #
      # It could not, for every run of its life (#439, #426, #459). `--check`
      # clones the mirror, `beyours-boilerplate` is PRIVATE, and this job
      # deliberately holds no `MIRROR_PUSH_TOKEN` — so every run died at
      # `git clone` with "could not read Username for 'https://github.com'"
      # and filed an issue saying the staleness of the mirror was unknown.
      # Daily. The check written to notice a stale mirror noticed nothing and
      # produced the only noise anybody ever saw from it.
      #
      # `MIRROR_READ_TOKEN` is the answer the issues asked for: a NEW secret,
      # `contents: read` on the mirror and nothing else. It is not
      # `MIRROR_PUSH_TOKEN` and must never be — `workflow-publish-gates.test.ts`
      # requires any job holding THAT to be gated on CI, because it can reach
      # every client site, and gating a daily "is the mirror stale?" question
      # behind a twelve-minute suite makes a tool nobody reaches for twice.
      #
      # UNSET IS A STATED SKIP, NOT A FAILURE AND NOT A SILENT PASS. The job
      # says in its own summary that it could not look and names the secret to
      # add. It does not open an issue, because "this repository has not been
      # given a read token" is a one-time decision and not news every morning —
      # and it does not go green pretending to have checked, because the step
      # summary is where a green job says what it did.
      - name: Is there a credential to read the mirror with?
        id: credential
        shell: bash
        env:
          MIRROR_READ_TOKEN: ${{ secrets.MIRROR_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${MIRROR_READ_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Say that the staleness check is switched off
        if: steps.credential.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### The staleness check did not run"
            echo
            echo "\`MIRROR_READ_TOKEN\` is not set on this repository, so this job"
            echo "cannot clone \`be-in-digital/beyours-boilerplate\` — it is private, and"
            echo "this job holds no \`MIRROR_PUSH_TOKEN\` on purpose."
            echo
            echo "**Nothing here says the mirror is behind.** It also does not say it is"
            echo "current. Staleness is being watched only by the observer half of this"
            echo "workflow, which reads \`Publish mirror\` conclusions and needs no clone."
            echo
            echo "To switch this half back on: create a fine-grained PAT with"
            echo "**\`contents: read\`** on \`beyours-boilerplate\` and nothing else, and add"
            echo "it as the repository secret \`MIRROR_READ_TOKEN\`. Do **not** reuse"
            echo "\`MIRROR_PUSH_TOKEN\`: a job holding that can reach every client site, and"
            echo "\`workflow-publish-gates.test.ts\` correctly refuses it to any job that is"
            echo "not gated on CI."
          } >> "$GITHUB_STEP_SUMMARY"

      # `--check` pushes nothing and needs no `MIRROR_PUSH_TOKEN`: it clones the
      # mirror over HTTPS with the read-only token above and exits 1 on drift.
      # The registry read is what `packages: read` is for.
      # `shell: bash` is load-bearing, not decoration. GitHub's default `run:`
      # shell on Linux is `bash -e {0}` — **without** `-o pipefail`, which you
      # only get by naming the shell. So `node … | tee …` reported *tee's*
      # exit status: the check exited 1 on drift, the step went green, the
      # reporting step below never ran, and this whole job was a no-op in
      # exactly the case it exists for. Measured: `bash -e` on a failing
      # pipeline gives 0, `bash -eo pipefail` gives 1.
      - name: Compare the mirror against apps/themes
        id: drift
        if: steps.credential.outputs.present == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # READ-ONLY, and that is the whole design. `publish-mirror.mjs` uses
          # it to clone and cannot push with it; `--check` does not push at
          # all. `MIRROR_PUSH_TOKEN` stays out of this job so it holds no
          # capability to reach the client mirror and therefore needs no CI
          # gate — see `workflow-publish-gates.test.ts`.
          MIRROR_READ_TOKEN: ${{ secrets.MIRROR_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/publish-mirror.mjs --check 2>&1 | tee /tmp/mirror-check.log

      # THE TITLE IS DECIDED BY WHAT WAS MEASURED, and it has to be.
      #
      # This step opened one issue titled "the boilerplate is behind apps/themes"
      # for BOTH outcomes — the drift it measured, and the check that never
      # finished. Its own body then said the opposite of its title: "`--check`
      # did not finish, so whether the mirror is current is unknown — this is
      # not a drift report." A person triaging from a list of issue titles is
      # told a fact the body denies, and #424's pull request predicted exactly
      # this case before it happened.
      #
      # So the title is computed first, from the log, and the two outcomes get
      # two different issues: they need different people and different actions.
      # Drift is "run Publish mirror"; a check that could not run is "this job
      # cannot reach the mirror", which no amount of re-running fixes.
      - name: Say what is stale, or that we could not tell
        if: failure() && steps.drift.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_TITLE: "Publish mirror: the boilerplate is behind apps/themes"
          UNKNOWN_TITLE: "Mirror health: the staleness check cannot reach the mirror"
        run: |
          set -uo pipefail

          if grep -q "drift detected between apps/themes and the mirror" /tmp/mirror-check.log; then
            TITLE="$DRIFT_TITLE"
          else
            TITLE="$UNKNOWN_TITLE"
          fi

          {
            if grep -q "drift detected between apps/themes and the mirror" /tmp/mirror-check.log; then
              echo "\`scripts/publish-mirror.mjs --check\` found drift between"
              echo "\`apps/themes\` at \`${GITHUB_SHA:0:7}\` and"
              echo "\`be-in-digital/beyours-boilerplate\`, which every client site is"
              echo "cloned from and merges from with \`pnpm update:template\`."
              echo
              echo "A sync should have happened on its own. Four ways it did not: the run"
              echo "was cancelled, it died, it was never triggered — the \`paths:\` filter"
              echo "in \`publish-mirror.yml\` enumerates what triggers one — or it ran and"
              echo "**refused**."
              echo
              echo "Check the refusal first, because it is the one a re-run cannot clear."
              echo "\`mirror-typecheck.mjs\` compiles the staged template against the engine"
              echo "versions the REGISTRY serves, and a symbol added to a package's source"
              echo "without a release exists in this workspace and not in what a client"
              echo "installs. Every sync is refused until a release carries it, including"
              echo "changes by other people. The failed run names the package and the"
              echo "symbol; the fix is \`pnpm check:pending-release\` and a Release, not a"
              echo "re-run and not deleting the import."
            else
              echo "\`scripts/publish-mirror.mjs --check\` **did not finish**, so whether"
              echo "the mirror is current is unknown. **This is not a drift report** — the"
              echo "mirror may be perfectly current. Nothing here says it is behind."
              echo
              echo "This job DID have a credential — it does not run at all without"
              echo "\`MIRROR_READ_TOKEN\`, and says so in its step summary instead. So the"
              echo "cause is not the one #439 and #459 were about: not an anonymous clone"
              echo "of a private repository. The log below says what it actually hit."
              echo
              echo "Worth checking first: the token has expired or its \`contents: read\`"
              echo "grant on \`beyours-boilerplate\` was withdrawn; the registry read"
              echo "(\`packages: read\`) failed; or the staged tree could not be installed"
              echo "or typechecked, which \`--check\` does before it compares."
            fi
            echo
            echo '```'
            tail -40 /tmp/mirror-check.log
            echo '```'
            echo
            echo "**To recover:** run \`Publish mirror\` from the Actions tab on \`main\`."
            echo
            echo "[This report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > /tmp/mirror-health.md

          cat /tmp/mirror-health.md >> "$GITHUB_STEP_SUMMARY"

          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/mirror-health.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/mirror-health.md
          fi

  # ── The third question ─────────────────────────────────────────────────────
  #
  # Does the mirror pass its OWN tests?
  #
  # Neither job above asks. The observer fires on a non-success conclusion of
  # *our* `Publish mirror` run; `stale` asks whether the mirror is CURRENT.
  # Measured on 15 September 2026 at `6707b699`: the boilerplate's CI had failed
  # four runs in a row while `Publish mirror` succeeded here. So the observer was
  # skipped, `stale` found the mirror current — because it WAS current, and red —
  # and a broken client template was reported to nobody.
  #
  # Current and red is the combination neither existing job can see, and it is
  # the one that matters most: every client repository is cloned from that tree
  # and merges from it with `pnpm update:template`.
  #
  # ON THE SCHEDULE, NOT ON A `workflow_run`. Gating this the way the observer is
  # gated would skip it in exactly the case it exists for, since our run
  # succeeded throughout the incident. `mirror-ci-watch.test.ts` asserts both
  # halves of that.
  #
  # IT NEEDS `actions: read`, WHICH `MIRROR_READ_TOKEN` MAY NOT HAVE. The token
  # was created for `contents: read` — that is what the clone in `stale` needs.
  # Without `actions: read` the API answers 403, the script reads that as
  # UNKNOWN, exits 0 and says which grant is missing. It does not open an issue:
  # "this token needs another grant" is a one-time decision, not news every
  # morning. It does not go green pretending to have checked either — the step
  # summary is where a green job says what it did.
  mirror-ci:
    name: Does the mirror pass its own CI?
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `shell: bash` for the reason the `stale` job states at length: GitHub's
      # default `run:` shell is `bash -e {0}`, without `-o pipefail`, so a
      # pipeline reports `tee`'s status and a failing check goes green.
      - name: Read the mirror's latest CI conclusion
        id: mirror
        if: always()
        continue-on-error: true
        shell: bash
        env:
          MIRROR_READ_TOKEN: ${{ secrets.MIRROR_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/check-mirror-ci.mjs 2>&1 | tee /tmp/mirror-ci.log

      - name: Say what the mirror's CI said
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### The mirror's own CI"
            echo
            echo '```'
            cat /tmp/mirror-ci.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only a measured RED opens an issue. `steps.mirror.outcome` is `failure`
      # exactly when the script exited 1, which it does for no other reason —
      # unknown exits 0 on purpose.
      - name: Report a red mirror
        if: steps.mirror.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Mirror health: the boilerplate does not pass its own CI"
        run: |
          set -uo pipefail
          {
            echo "\`be-in-digital/beyours-boilerplate\` is the repository every client"
            echo "site is cloned from and merges from with \`pnpm update:template\`, and"
            echo "its latest run on its default branch did not pass."
            echo
            echo "**The mirror being CURRENT does not help here.** A current mirror of a"
            echo "tree whose tests fail is a broken template delivered promptly. The two"
            echo "other jobs in this workflow both read green through this state, which"
            echo "is why this job exists."
            echo
            echo "Read the failing jobs named below before re-running anything. The two"
            echo "causes that look identical from here and need opposite actions:"
            echo
            echo "- **The mirror pins PUBLISHED engine versions.** A fix that is merged"
            echo "  here but not released does not exist for the mirror, so its tests"
            echo "  fail against the build the registry still serves. The fix is a"
            echo "  Release — \`pnpm check:pending-release\` says what is waiting — not a"
            echo "  re-run."
            echo "- **A defect that only appears outside the workspace.** Every check"
            echo "  here runs \`apps/themes\` with \`packages/*\` symlinked at HEAD and the"
            echo "  monorepo all around it. A client has none of that."
            echo "  \`pnpm check:mirror-build\` reproduces the delivered shape locally."
            echo
            echo '```'
            cat /tmp/mirror-ci.log
            echo '```'
            echo
            echo "[This report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > /tmp/mirror-ci-report.md

          cat /tmp/mirror-ci-report.md >> "$GITHUB_STEP_SUMMARY"

          # One issue, commented on rather than duplicated — the same rule the
          # two jobs above follow, and for the same reason: a mirror that stays
          # red produces this verdict every single morning.
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/mirror-ci-report.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/mirror-ci-report.md
          fi

  # ── The fourth question ────────────────────────────────────────────────────
  #
  # Is a release still owed, and for how long?
  #
  # `check:source-drift` reports three states. `drift` — source moved and no
  # changeset exists — already GATES, in `ci.yml`'s `Lint`, because it never
  # resolves itself. `waiting` — a changeset exists and no release has been cut —
  # does not gate, and must not: batching a few fixes into one release is the
  # intended workflow, so `Lint` would fail every pull request opened while a
  # changeset sits in `.changeset/`. Measured on 15 September 2026 at
  # `a92a0e51`: `@be-yours/admin` was `waiting`, so passing `--fail-waiting`
  # in `Lint` would have turned `main` itself red that day, and every branch off
  # it. #519 asked for that placement or an argument against it; this is the
  # argument, and this job is where the flag belongs instead.
  #
  # WHY IT BELONGS ON A SCHEDULE. `waiting` is not wrong, it is a clock. A
  # changeset that has sat for an hour is a normal batch; one that has sat for a
  # week means every client site is installing the build made before those files
  # moved, and nobody noticed. A daily question about the fleet is exactly the
  # shape of this workflow's other three, and a red here blocks nobody's merge.
  #
  # `--no-registry` is NOT passed: the subpath half is the deadlock case — a
  # package declaring an export its published version does not carry refuses
  # every sync until a release lands — and it is worth a daily answer. The
  # registry read is what `packages: read` is for.
  release-waiting:
    name: Is a release still owed?
    needs: [hold]
    # Held means this measures a deliberate state — see the `hold` job.
    if: github.event_name != 'workflow_run' && needs.hold.outputs.held != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      # `fetch-depth: 0`, and it is load-bearing. `check-source-drift` finds each
      # package's last version bump with `git log -G`, and a depth-1 clone has no
      # commit to find: the check reports `unknown` rather than guessing, so the
      # whole job would answer nothing while looking like it had answered.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@be-yours"
          cache: "pnpm"

      - name: How long has a release been owed?
        id: waiting
        continue-on-error: true
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/check-source-drift.mjs --fail-waiting 2>&1 | tee /tmp/source-drift.log

      - name: Say what is waiting
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### Releases owed"
            echo
            echo '```'
            cat /tmp/source-drift.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report a release that has not been cut
        if: steps.waiting.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Mirror health: a release is owed and client sites do not have it"
        run: |
          set -uo pipefail
          {
            echo "One or more engine packages have source that no release has carried."
            echo "Each has a changeset, so nothing is missing and nothing is wrong with"
            echo "the workflow — but until a Release runs, the registry serves the build"
            echo "made **before** those files moved, and that is what every client site"
            echo "installs."
            echo
            echo "This is a clock, not a defect. An hour is a normal batch. A week means"
            echo "a fix that was merged here reaches nobody, which is what #516 was."
            echo
            echo "**To clear it:** \`pnpm version-packages\`, commit the bumped manifests"
            echo "and CHANGELOGs, and merge. \`Release\` publishes on that merge and"
            echo "\`Publish mirror\` syncs behind it. The table below says which packages"
            echo "and how many files."
            echo
            echo "This used to say to run \`Release\` from the Actions tab. It has no"
            echo "\`workflow_dispatch\` — push to \`main\` and nothing else — so there was"
            echo "no such button, and the one instruction this report exists to give"
            echo "could not be followed. \`release.yml\` and \`publish-plan.mjs\` have both"
            echo "printed the command above all along; only this report disagreed."
            echo
            echo "If a package's registry file is generated from the manifests — the MCP"
            echo "registry is — it needs a changeset of ITS own, and \`sync:versions\` run"
            echo "AFTER \`changeset version\`, in the same commit. That file is the"
            echo "package's own source, so a release leaving it behind ships a version"
            echo "index one release behind the versions it indexes."
            echo
            echo '```'
            cat /tmp/source-drift.log
            echo '```'
            echo
            echo "[This report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > /tmp/release-waiting.md

          cat /tmp/release-waiting.md >> "$GITHUB_STEP_SUMMARY"

          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/release-waiting.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/release-waiting.md
          fi
