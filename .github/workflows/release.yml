name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # `changeset publish` used to run on a bare package build: no lint, no
  # type-check, no tests, no app build. A failing test did not stop publication
  # to GitHub Packages, nor the mirror to `beyours-boilerplate` that follows it.
  # Reusing ci.yml rather than restating its four jobs here — a copy would drift
  # from the checks branch protection actually requires.
  #
  # The fifth check now lives here too. This call covers `Lint`, `Type Check`,
  # `Test` and `Build` — measured on run 33761018116, where `verify` expanded to
  # exactly those four — and the `e2e` call below supplies `E2E Status`, which was
  # added to ruleset 22177735 on 03/09/2026 and which this chain gated on for
  # four days without saying so (#308). Measured on `aa026e6`: Release finished
  # 6m45s before the suite reported.
  #
  # The cost of the call is that CI runs twice on a push to main: once from its
  # own trigger, once through this one. That is deliberate. The alternative,
  # keying off `workflow_run`, would make this workflow publish and tag from a
  # SHA it has to reconstruct from the event, and this is not the workflow to
  # be clever in.
  verify:
    name: Verify
    permissions:
      contents: read
      # `packages: read`, because a CALLED workflow may not request more than
      # its caller grants — and `ci.yml`'s `lint` job began requesting it in
      # #446, to read the published tarballs for the subpath half of
      # `check:source-drift`.
      #
      # This one line is what its absence cost: every `Release` and every
      # `Publish mirror` since e5394e5 ended in `startup_failure`. The run never
      # begins, so it has no jobs, no steps and no logs — nothing that reads as
      # a failure anyone would open. Three merges published nothing (#446, #447,
      # #448) and the mirror stayed frozen throughout, while `ci.yml`'s own
      # `push` and `pull_request` runs stayed green: a reusable workflow is only
      # narrowed when it is CALLED, so the fault is invisible from the file that
      # causes it.
      packages: read
    uses: ./.github/workflows/ci.yml

  # Whether there is anything to gate.
  #
  # Paying the E2E suite twice on every push to main — eight sharded runners,
  # about twelve minutes — buys nothing on a push that publishes nothing, and
  # almost every push publishes nothing: of the 293 commits on `main` between
  # 01/07/2026 and 07/09/2026, **12 moved a `packages/*` version**. The other
  # 281 would have waited twelve minutes for `changeset publish` to print
  # "No unpublished projects to publish".
  #
  # So the chain asks the question `changeset publish` itself asks — is this
  # version already on the registry? — in about five seconds, and gates only
  # when the answer is no. A lookup that fails answers "would publish", so a
  # broken token gates rather than waves through.
  #
  # `packages: read` is the whole permission: this reads the registry, it does
  # not touch it.
  #
  # It answers a second question on the way past, and that one is not about
  # cost. "Nothing to publish" has two causes `changeset publish` reports
  # identically — ten lines of `already published`, exit 0 — and only one of
  # them is healthy. Either no fix is waiting, or fixes are waiting and
  # `changeset version` has not been run, which stalls the whole chain:
  # nothing published means nothing tagged, and `publish-mirror.yml`'s
  # `workflow_run` path requires a tag at HEAD, so the mirror stops syncing
  # behind it with a green no-op of its own. Measured on the eight commits
  # after `3a6cb8d`: this workflow was green on seven, published on none, and
  # `beyours-boilerplate` sat eight commits behind the whole time carrying
  # #408's build error.
  #
  # `bump_owed` is that verdict. It is a WARNING annotation and not a failure,
  # for a reason worth stating where somebody would otherwise "fix" it: the
  # mirror's `workflow_run` path fires only on `conclusion == 'success'`, so
  # failing this job would stop the sync altogether — the gate would cause the
  # outage it reports.
  #
  # The `owed-bump` job below reads it and opens an issue. That is #427's last
  # finding: the warning and the step summary were there the whole time and are
  # visible only to whoever opens the run, and a push to `main` has no pull
  # request to annotate and no author to notify. Making it BLOCKING is still a
  # workflow change rather than a script rewrite.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      publishing: ${{ steps.plan.outputs.publishing }}
      bump_owed: ${{ steps.plan.outputs.bump_owed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@be-yours"

      - name: Will this publish anything?
        id: plan
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-plan.mjs

  # A MERGED FIX THAT REACHES NO CLIENT, SAID WHERE SOMEBODY SEES IT (#427, #389).
  #
  # `plan` already computes `bump_owed` and already writes a `::warning::` and a
  # step summary. Both are visible only to somebody who opens the run, and on a
  # push to `main` there is no pull request to annotate and no author to notify —
  # so nobody does.
  #
  # Measured, on this repository, on 11 September 2026: six changesets sat on
  # `main` for over an hour with the mirror blocked behind them, `Release` went
  # green four times in a row, and the only thing that ever told anybody was
  # `mirror-health.yml` opening an issue AFTER a `Publish mirror` run had already
  # failed. The warning was there the whole time. That is #427's last finding —
  # "every green signal is uninformative" — and #389's second.
  #
  # Not blocking, and `publish-plan.mjs` says why at length: the mirror's
  # `workflow_run` path fires only on `conclusion == 'success'`, so failing here
  # would stop the sync this is reporting on. The gate would cause the outage.
  #
  # Same shape as `mirror-health.yml` and `env-store-health.yml`, deliberately:
  # one issue, commented on rather than duplicated, and `continue-on-error`
  # because this organisation forbids Actions from opening pull requests and
  # whether that extends to issues is not something this repository can read.
  # A refusal must never be the thing that hides the finding.
  owed-bump:
    name: Say a version bump is owed
    needs: [plan]
    if: needs.plan.outputs.bump_owed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the report
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Release: a version bump is owed, and the mirror is waiting"
        run: |
          set -uo pipefail
          {
            echo "\`main\` carries merged changesets that no release has cut, so"
            echo "**no client site has these fixes** and \`Publish mirror\` will not sync."
            echo
            echo "This is not a build failure. \`apps/themes\` links the engine with"
            echo "\`workspace:^\` and compiles the current source, so this repository is"
            echo "green by construction; the mirror pins the version the registry serves,"
            echo "so the boilerplate's typecheck fails on any API only the workspace has."
            echo "Until a release exists the mirror refuses EVERY sync — including changes"
            echo "that have nothing to do with the ones waiting."
            echo
            echo "**To clear it:** \`pnpm version-packages\`, commit the bumped manifests"
            echo "and CHANGELOGs, and merge. \`Release\` publishes on that merge and"
            echo "\`Publish mirror\` syncs behind it."
            echo
            echo "If a package's registry file is generated from the manifests — the MCP"
            echo "registry is — re-run its \`sync:versions\` in the same commit, or"
            echo "\`check:source-drift\` will name it on the next push."
            echo
            echo "Commit: \`${GITHUB_SHA:0:7}\`"
            echo
            echo "[This report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > /tmp/owed-bump.md

          cat /tmp/owed-bump.md >> "$GITHUB_STEP_SUMMARY"

          # One issue, commented on rather than duplicated: a week of merges with
          # no release would otherwise file a dozen identical ones, which is read
          # as noise and muted — the failure mode this exists to escape.
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/owed-bump.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/owed-bump.md
          fi

  # The fifth required check, on the commit about to be published.
  #
  # Both suites, not one: a release ships `packages/*`, which both applications
  # consume, so the answer the publish needs is the same one branch protection
  # asks for on a pull request. `e2e.yml` gained `workflow_call:` for this —
  # until then it could not be called at all, which is the whole of #308.
  #
  # Skipped when `plan` says nothing will publish. That is not a hole: a run
  # that publishes nothing has nothing to gate, and `main` still gets its own
  # `E2E Tests` run from e2e.yml's `push` trigger either way — this call is the
  # one the publish waits for.
  e2e:
    name: Verify E2E
    needs: [plan]
    if: needs.plan.outputs.publishing == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      apps: both

  release:
    name: Release
    needs: [plan, verify, e2e]
    runs-on: ubuntu-latest
    # `e2e` is skipped on the 96% of pushes that publish nothing, and a
    # job whose `needs:` was skipped is skipped too unless its `if:` uses a
    # status function — the same trap `publish-mirror.yml` documents. So
    # `!cancelled()` first, then each dependency by result:
    #
    #   plan    must have PASSED — a plan that errored has not said "nothing to
    #           publish", it has said nothing, and `e2e` skips itself on an
    #           unset output, which would otherwise read as "no gate needed"
    #   verify  must have PASSED — it runs unconditionally
    #   e2e     must not have FAILED or been CANCELLED — `skipped` is the
    #           ordinary answer and means there was nothing to gate
    #
    # Naming `cancelled` explicitly matters: a suite the concurrency group
    # cancelled has not passed, and the old `E2E Status` job was announcing
    # exactly that as a success until #276.
    if: >-
      ${{ !cancelled()
        && needs.plan.result == 'success'
        && needs.verify.result == 'success'
        && needs.e2e.result != 'failure'
        && needs.e2e.result != 'cancelled' }}
    permissions:
      # `contents` for the tags `changeset publish` writes. No `pull-requests`:
      # this workflow does not open one, and cannot - see the publish step.
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@be-yours"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-release-

      - name: Build packages
        # Only the packages are published. The apps are not, and building them
        # needs an application env — no reason to set that up here.
        run: pnpm build --filter='./packages/*'

      # Publish only. Versioning is a human step, written up in
      # apps/docs/deployment/github-packages.md.
      #
      # `changesets/action` opens a "version packages" pull request whenever a
      # changeset is pending, and this enterprise forbids that outright:
      #
      #   The enterprise does not allow GitHub Actions to create or approve
      #   pull requests
      #
      # It is an enterprise-level policy, so no repository setting can grant it.
      # The job therefore failed on every push to main for as long as a
      # changeset was waiting - and a red Release is indistinguishable from a
      # publish that actually broke.
      #
      # `changeset publish` compares the versions on main against the registry
      # and pushes whatever is missing, so a merged version bump releases
      # itself. With nothing to do it prints "No unpublished projects to
      # publish" and exits 0.
      # `changeset publish` tags each published package with `git tag -m`, an
      # ANNOTATED tag, and an annotated tag needs a committer. A runner has
      # none, so the tag command failed - and changesets prints "New tag: X"
      # before tagging and ignores the result, so the failure was invisible.
      # `changesets/action` used to set this identity; dropping the action in
      # #122 dropped it too, and 4bfc4f1d published three packages and tagged
      # nothing.
      - name: Identify the tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish packages
        run: pnpm exec changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The checkout fetches with --no-tags, so anything here was made by the
      # step above and belongs on the remote. A publish that tagged nothing
      # leaves this a no-op.
      #
      # `git push --tags` is quiet about doing nothing, which is exactly how the
      # missing identity stayed hidden: it reported "Everything up-to-date"
      # while three packages went out untagged. So compare instead of trusting
      # it - if a version was published, its tag must exist here.
      - name: Push release tags
        run: |
          tags=$(git tag --points-at HEAD)
          if [ -z "$tags" ]; then
            echo "No tags created — nothing was published."
            exit 0
          fi
          echo "Pushing:"; echo "$tags" | sed "s/^/  /"
          git push origin --tags
