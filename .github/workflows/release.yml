name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # `contents` for the tags `changeset publish` writes. No `pull-requests`:
      # this workflow does not open one, and cannot - see the publish step.
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@be-in-digital"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-release-

      - name: Build packages
        # Only the packages are published. The apps are not, and building them
        # needs an application env — no reason to set that up here.
        run: pnpm build --filter='./packages/*'

      # Publish only. Versioning is a human step, written up in
      # apps/docs/deployment/github-packages.md.
      #
      # `changesets/action` opens a "version packages" pull request whenever a
      # changeset is pending, and this enterprise forbids that outright:
      #
      #   The enterprise does not allow GitHub Actions to create or approve
      #   pull requests
      #
      # It is an enterprise-level policy, so no repository setting can grant it.
      # The job therefore failed on every push to main for as long as a
      # changeset was waiting - and a red Release is indistinguishable from a
      # publish that actually broke.
      #
      # `changeset publish` compares the versions on main against the registry
      # and pushes whatever is missing, so a merged version bump releases
      # itself. With nothing to do it prints "No unpublished projects to
      # publish" and exits 0.
      - name: Publish packages
        run: pnpm exec changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `changeset publish` tags each released package locally. The checkout
      # carries no other tags, so this pushes only what it just made, and is a
      # no-op when it published nothing.
      - name: Push release tags
        run: git push --tags
