name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # The merge queue. It builds the prospective merged state of the batch and
  # asks these same jobs about it, so the checks branch protection requires have
  # to answer here too — a queue whose required checks never run is a queue that
  # never merges anything.
  merge_group:
  # Callable so `release.yml` can gate publication on these four jobs. Adding
  # this changes nothing for the push and pull_request runs above — in
  # particular the job names stay `Lint` / `Type Check` / `Test` / `Build`,
  # which is what branch protection requires by name.
  workflow_call:

concurrency:
  # One run per ref, and the older one loses.
  #
  # Two pushes to a branch used to start two full suites; the first became
  # useless the moment the second existed, and on the E2E workflow that is
  # twenty minutes of runner for an answer nobody will read. Branch protection
  # reads the most recent run for a given check name, so cancelling the stale
  # one cannot leave a required check red.
  #
  # `merge_group` is the exception: the queue is waiting on that run to decide
  # whether the batch may land, and a cancelled job is a failed one.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# Turborepo's remote cache, shared by every job here.
#
# `TURBO_TOKEN` is a Vercel access token and lives in the repository secrets;
# the team slug is not a secret — it is in the URL of every Vercel check on
# every pull request. Until the secret exists this block is inert, which was
# measured rather than hoped: an empty token exits 0, and an invalid one still
# ran 7 tasks out of 7 and fell back to the local cache. A misconfigured cache
# degrades; it does not break the build.
#
# What makes this safe is `globalDependencies: ["**/.env.*local"]` in
# turbo.json. The build bakes NEXT_PUBLIC_CONVEX_URL into the client bundle and
# into the CSP from it, and the e2e job builds with an `.env.local` the `Build`
# job does not have. Measured: no file `6fdf134d`, one URL `3aae56a1`, another
# `79edf744`. Three inputs, three keys — the e2e build cannot be served the CI
# one, which would produce an app with no backend and a global error boundary
# on every route.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: be-in-digital

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-lint-

      - name: Run lint
        run: pnpm lint

      # Folded into Lint rather than given their own jobs on purpose: `Lint` is
      # already one of the four contexts branch protection requires by name, so
      # these become blocking without anyone having to touch repository
      # settings. Each script's header says what it checks and why.
      - name: Check French accents
        run: pnpm check:accents

      - name: Check app divergence
        run: pnpm check:divergence

      # The one check that looks at what a CLIENT builds rather than at what
      # this repository builds. `apps/themes` is published verbatim to
      # `beyours-boilerplate`, where it is the repository root, and a stylesheet
      # whose `@source` globs point at the monorepo silently loses every rule
      # the engine packages contribute. Nothing else in CI compiles the
      # published tree, which is why that shipped twice.
      - name: Check the client stylesheet
        run: pnpm check:mirror-css

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-type-check-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-type-check-

      - name: Run type check
        run: pnpm type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # See the same guard in e2e.yml: a step's `if:` cannot read `secrets`,
      # a job's `env:` can, and `if:` can read `env`. So the Infisical steps
      # skip themselves when the credentials are not there yet.
      HAS_INFISICAL: ${{ secrets.INFISICAL_CLIENT_ID != '' && secrets.INFISICAL_CLIENT_SECRET != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      # The only CI consumer of the store. `e2e.yml` deliberately is not one:
      # since #276 it starts its own Convex backend on the runner and reads no
      # secret at all, which is a better answer than provisioning one.
      #
      # What this can change is narrow by construction: turbo.json declares only
      # SENTRY_ORG / SENTRY_PROJECT / SENTRY_AUTH_TOKEN in the build task's
      # `env`, so those three — plus NEXT_PUBLIC_*, through framework inference
      # — are all that can reach the build. Everything else is stripped by turbo
      # before `next build` sees it.
      #
      # Two gates and `continue-on-error`, because `Build` is a REQUIRED check
      # on main and what the store adds here is source maps: an enhancement the
      # build compiles perfectly without. An Infisical outage, a rotated
      # identity or a typo in a variable must not become "nobody can merge".
      - name: Load the shared credentials from Infisical
        if: vars.INFISICAL_ENABLED == 'true' && env.HAS_INFISICAL == 'true'
        continue-on-error: true
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: beyours-platform-4mu-x
          env-slug: ${{ vars.INFISICAL_ENV || 'prod' }}
          secret-path: /platform
          export-type: env

      # These are STEP-level env, which outranks $GITHUB_ENV. That is what
      # keeps a real Convex URL from the store out of this compile-check build,
      # where it would be inlined into the bundle.
      #
      # NEXT_PUBLIC_TVA_ENABLED is pinned for the opposite reason: it is also
      # inlined, and apps/site reports an undeclared charging flag in the build
      # log because that is the moment the value is frozen. A compile check
      # should compile a bundle whose VAT stance is declared, not one that
      # happens to be undeclared. It matches VAT.regime in lib/legal/company.ts.
      - name: Build packages
        env:
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          CONVEX_SITE_URL: https://placeholder.convex.site
          NEXT_PUBLIC_TVA_ENABLED: "true"
        # All three apps are built: the merge made the graph complete.
        run: pnpm build
