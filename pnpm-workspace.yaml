# Le boilerplate declare les paquets moteur en versions publiees (^2.0.2) pour
# la distribution client. En workspace on les relie localement : on developpe
# contre le moteur courant. Le job de publication reecrit ces versions.
linkWorkspacePackages: true

packages:
  - "packages/*"
  - "apps/*"

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# NOTE: les overrides pnpm vivent dans package.json racine ("pnpm.overrides")
# — pnpm 10.4 ignore la section overrides de ce fichier.
