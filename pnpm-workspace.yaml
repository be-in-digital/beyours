# The boilerplate declares the engine packages at published versions (^2.0.2)
# for client distribution. In the workspace we link them locally instead, so we
# develop against the current engine. The publish job rewrites those versions.
linkWorkspacePackages: true

packages:
  - "packages/*"
  - "apps/*"

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# NOTE: pnpm overrides live in the root package.json ("pnpm.overrides")
# — pnpm 10.4 ignores the overrides section of this file.
